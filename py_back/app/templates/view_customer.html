<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>View Customer Form</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 20px; color: #1f2937; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .page-header { background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 20px rgba(2, 6, 23, .08); margin-bottom: 12px; display: grid; grid-template-columns: 180px 1fr auto; gap: 14px; align-items: center; }
    .brand-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .brand-art { width: 160px; max-width: 100%; height: auto; display: block; }
    .brand-text { text-align: center; font-size: 20px; line-height: 1.4; color: #475569; font-weight: 700; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar button { width: auto; padding: 10px 14px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); }
    h1 { margin-top: 0; font-size: 26px; color: #1e3a8a; }
    h2 { margin: 20px 0 10px; font-size: 18px; color: #1e3a8a; border-bottom: 1px solid #dbeafe; padding-bottom: 6px; }
    .subcard { background: #f8fbff; border: 1px solid #dbeafe; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .subcard h3 { margin: 0 0 12px; font-size: 16px; color: #1e3a8a; }
    .group-team-card { border-color: #cbd5e1; background: #f1f5f9; }
    .group-team-title {
      margin: 0 0 16px;
      text-align: center;
      text-decoration: underline;
      font-size: clamp(28px, 4vw, 44px);
      color: #1f2937;
      font-weight: 700;
    }
    .group-team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      align-items: end;
    }
    .group-team-grid .row { margin-bottom: 0; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .row { margin-bottom: 10px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #334155; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; }
    input, select, textarea { background: #f8fafc; color: #1f2937; }
    textarea { min-height: 84px; resize: vertical; }
    [data-team-field="true"] { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px; }
    .switch-row {
      border: 1px solid #ea580c;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      margin-top: 6px;
    }
    .switch-row span { font-size: 13px; font-weight: 700; color: #1f2937; }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #9ca3af;
      transition: .2s;
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider { background-color: #16a34a; }
    .switch input:checked + .slider:before { transform: translateX(24px); }
    .doc-preview {
      margin-top: 10px;
      border: 1px solid #dbe3f1;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .doc-preview.hidden { display: none; }
    .doc-preview iframe {
      width: 100%;
      min-height: 480px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .doc-preview embed {
      width: 100%;
      min-height: 480px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .doc-preview img {
      max-width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .pdf-js-viewer {
      display: grid;
      gap: 14px;
      max-height: 720px;
      overflow: auto;
      padding: 8px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
    }
    .pdf-js-page {
      display: flex;
      justify-content: center;
      background: #e2e8f0;
      padding: 10px;
      border-radius: 8px;
    }
    .pdf-js-page canvas {
      max-width: 100%;
      height: auto;
      background: #fff;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.16);
    }
    .pdf-js-status { padding: 18px; text-align: center; color: #475569; font-weight: 700; }
    .doc-actions { margin-bottom: 10px; display: flex; justify-content: flex-end; }
    .doc-actions a { color: #1d4ed8; font-weight: 700; text-decoration: none; }
    .gst-filing-note { margin-top: 8px; color: #64748b; font-size: 12px; }
    .gst-filing-modal {
      position: fixed;
      inset: 0;
      z-index: 1200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(15, 23, 42, .45);
    }
    .gst-filing-modal.hidden { display: none !important; }
    .gst-filing-box {
      width: min(1100px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: hidden;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(15, 23, 42, .24);
      display: flex;
      flex-direction: column;
    }
    .gst-filing-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px 12px;
      border-bottom: 1px solid #dbeafe;
    }
    .gst-filing-header h3 {
      margin: 0;
      color: #1e3a8a;
      font-size: 18px;
    }
    .gst-filing-close-btn {
      width: auto;
      padding: 8px 12px;
      background: #475569;
    }
    .gst-filing-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 18px 0;
    }
    .gst-filing-controls {
      display: flex;
      align-items: end;
      gap: 12px;
      padding: 12px 18px 8px;
      border-bottom: 1px dashed #dbeafe;
    }
    .gst-filing-controls.hidden { display: none !important; }
    .gst-filing-controls .field {
      flex: 1 1 auto;
      min-width: 220px;
    }
    .gst-filing-controls label {
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
    }
    .gst-filing-controls select { background: #fff; }
    .gst-filing-controls button {
      width: auto;
      min-width: 130px;
      padding: 10px 14px;
      white-space: nowrap;
    }
    .gst-filing-body {
      padding: 16px 18px 18px;
      overflow: auto;
    }
    .gst-filing-table-card {
      border: 1px solid #dbeafe;
      border-radius: 10px;
      padding: 12px;
      background: #f8fbff;
      margin-bottom: 14px;
    }
    .gst-filing-table-card h4 {
      margin: 0 0 10px;
      color: #1e3a8a;
      font-size: 15px;
    }
    .gst-filing-table-wrap {
      overflow: auto;
      border: 1px solid #dbeafe;
      border-radius: 8px;
      background: #fff;
    }
    .gst-filing-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 420px;
    }
    .gst-filing-table th,
    .gst-filing-table td {
      border-bottom: 1px solid #e2e8f0;
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
    }
    .gst-filing-table th {
      background: #eff6ff;
      color: #1e3a8a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .03em;
    }
    .gst-filing-empty {
      padding: 18px 14px;
      color: #64748b;
      font-style: italic;
    }
    .validation-change-note {
      border: 1px solid #fed7aa;
      border-radius: 8px;
      background: #fff7ed;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .validation-change-note h4 {
      margin: 0 0 8px;
      color: #9a3412;
      font-size: 14px;
    }
    .validation-change-table-wrap {
      overflow: auto;
      border: 1px solid #fed7aa;
      border-radius: 8px;
      background: #fff;
    }
    .validation-change-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 520px;
    }
    .validation-change-table th,
    .validation-change-table td {
      border-bottom: 1px solid #ffedd5;
      padding: 8px 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }
    .validation-change-table th {
      background: #ffedd5;
      color: #9a3412;
      font-size: 12px;
    }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { background: #dbeafe; color: #1e40af; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
    .msg { margin-top: 8px; font-size: 14px; }
    .msg.ok { color: #0a7a2d; }
    .msg.err { color: #b3261e; }
    .muted { color: #64748b; font-style: italic; }
    .check-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 4px; margin-bottom: 10px; }
    .check-item { display: flex; align-items: center; gap: 8px; font-weight: 700; color: #1f2937; }
    .check-item input { width: auto; }
    .hidden { display: none !important; }
    .validator-inline-checks {
      border: 1px solid #dbeafe;
      border-radius: 8px;
      background: #f8fbff;
      padding: 10px 12px;
      margin-top: 8px;
    }
    .validator-inline-checks h4 { margin: 0 0 8px; color: #1e3a8a; font-size: 14px; }
    .validation-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px 12px;
    }
    .tax-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .tax-grid .row { margin-bottom: 0; }
    .tax-typed-input { background: #f8fafc; }
    .reject-target-row { margin-top: 2px; margin-bottom: 10px; }
    .decision-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .decision-actions button { width: auto; padding: 10px 16px; }
    .req-star { color: #dc2626; margin-left: 4px; font-weight: 700; }
    .req-star.hidden { display: none; }
    .secondary-btn { background: #475569; }
    button { background: #1d4ed8; color: #fff; border: none; font-weight: 700; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }

    @media (max-width: 980px) {
      .page-header { grid-template-columns: 1fr; text-align: center; }
      .brand-left { align-items: center; }
      .grid { grid-template-columns: 1fr; }
      .tax-grid { grid-template-columns: 1fr; }
      .gst-filing-box { width: calc(100vw - 24px); max-height: calc(100vh - 24px); }
      .gst-filing-controls { flex-direction: column; align-items: stretch; }
      .gst-filing-controls .field { min-width: 0; width: 100%; }
      .gst-filing-controls button { width: 100%; }
      .gst-filing-table { min-width: 320px; }
    }
  </style>

<body>
  <div class="wrap">
    <div class="page-header">
      <div class="brand-left">
        <img src="/web/header-art-image" alt="Header Art" class="brand-art" />
      </div>
      <div class="brand-text">Sharp & Tannan Chartered Accountants</div>
      <div></div>
    </div>

    <div id="topToolbar" class="toolbar">
      <button type="button" id="goBackBtn">Go Back</button>
      <button type="button" onclick="logoutAndRedirect()">Logout</button>
    </div>

    <div class="card">
      <h1 id="pageHeading">View Customer Registration Form</h1>
      <div id="metaBadges" class="meta"></div>
      <div id="message" class="msg"></div>
      <div id="sectionHost"></div>

      <div id="approvalActionCard" class="subcard">
        <h3 id="approvalActionTitle">Approval Action</h3>
        <div id="decisionChoiceRow" class="check-row">
          <label class="check-item"><input id="approveCheckbox" type="checkbox" />Approve</label>
          <label class="check-item"><input id="rejectCheckbox" type="checkbox" />Reject</label>
        </div>
        <div id="validatorRejectToContainer" class="row full hidden">
          <label>Reject To <span id="validatorRejectToRequired" class="req-star hidden">*</span></label>
          <div class="check-row reject-target-row">
            <label class="check-item"><input type="radio" name="validatorRejectTo" value="Customer" />Customer</label>
            <label class="check-item"><input type="radio" name="validatorRejectTo" value="Buyer" />Buyer</label>
          </div>
        </div>
        <div class="row full">
          <label id="decisionRemarksLabel" for="decisionRemarks">Remarks</label>
          <textarea id="decisionRemarks" placeholder="Write remarks here"></textarea>
        </div>
        <div class="decision-actions">
          <button id="submitDecisionBtn" type="button" disabled>Submit</button>
          <button id="closeViewBtn" type="button" class="secondary-btn hidden">Close</button>
        </div>
        <div id="decisionMessage" class="msg"></div>
      </div>
    </div>

    <div id="gstFilingModal" class="gst-filing-modal hidden" aria-hidden="true">
      <div class="gst-filing-box" role="dialog" aria-modal="true" aria-labelledby="gstFilingTitle">
        <div class="gst-filing-header">
          <h3 id="gstFilingTitle">GST Return Filing Details</h3>
          <button type="button" id="gstFilingCloseBtn" class="gst-filing-close-btn">Close</button>
        </div>
        <div id="gstFilingMeta" class="gst-filing-meta"></div>
        <div id="gstFilingControls" class="gst-filing-controls hidden">
          <div class="field">
            <label for="gstFilingFinancialYear">Financial Year</label>
            <select id="gstFilingFinancialYear"></select>
          </div>
          <button type="button" id="gstFilingFetchBtn">Submit</button>
        </div>
        <div id="gstFilingBody" class="gst-filing-body"></div>
      </div>
    </div>
  </div>

  <script>
    function requireSessionLogin() {
      if (sessionStorage.getItem("token")) {
        return;
      }
      fetch("/api/auth/logout", { method: "POST", keepalive: true }).catch(() => {});
      window.location.replace("/web/login");
    }

    requireSessionLogin();

    async function logoutAndRedirect() {
      await fetch("/api/auth/logout", { method: "POST" });
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");
      sessionStorage.removeItem("name");
      window.location.href = "/web/login";
    }

    async function parseApiResponse(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { detail: text };
      }
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isMeaningfulValue(value) {
      if (value === null || value === undefined) return false;
      if (typeof value === "string" && value.trim() === "") return false;
      return true;
    }

    function formatValue(value) {
      if (value === null || value === undefined) return "";
      if (typeof value === "boolean") return value ? "Yes" : "No";
      return String(value);
    }

    function pickWithSource(record, keys, fallback = "") {
      for (const key of keys) {
        if (!Object.prototype.hasOwnProperty.call(record, key)) continue;
        const value = record[key];
        if (isMeaningfulValue(value)) {
          return { value, sourceKey: key };
        }
      }
      for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(record, key)) {
          return { value: record[key], sourceKey: key };
        }
      }
      return { value: fallback, sourceKey: keys[0] || "" };
    }

    function toDocumentUrl(rawValue) {
      const value = String(rawValue || "").trim();
      if (!value) return "";
      if (value.startsWith("http://") || value.startsWith("https://") || value.startsWith("/")) {
        return value;
      }
      return `/mock-files/${encodeURIComponent(value)}`;
    }

    function getDocumentFieldName(field, sourceKey) {
      const keys = Array.isArray(field?.keys) ? field.keys : [];
      const explicitName = String(field?.name || "").trim();
      if (explicitName) return explicitName;
      const source = String(sourceKey || "").trim();
      const normalizedSource = source.toLowerCase();
      if (
        source
        && !normalizedSource.endsWith("filename")
        && !normalizedSource.endsWith("_filename")
        && !normalizedSource.endsWith("_name")
      ) {
        return source;
      }
      const preferredKey = keys.find((key) => {
        const normalized = String(key || "").trim().toLowerCase();
        if (!normalized) return false;
        return !(
          normalized.endsWith("filename")
          || normalized.endsWith("_filename")
          || normalized.endsWith("_name")
        );
      });
      return String(preferredKey || keys[0] || sourceKey || "").trim();
    }

    function buildRecordDocumentUrl(recordId, fieldName, rawValue) {
      const resolvedRecordId = String(recordId || currentRecordId || "").trim();
      const resolvedFieldName = String(fieldName || "").trim();
      if (resolvedRecordId && resolvedFieldName) {
        const endpointBase = "/api/customer/document";
        return `${endpointBase}?recordId=${encodeURIComponent(resolvedRecordId)}&fieldName=${encodeURIComponent(resolvedFieldName)}`;
      }
      return toDocumentUrl(rawValue);
    }

    function fileNameFromUrl(url) {
      const clean = String(url || "").split("?")[0];
      if (!clean) return "";
      const parts = clean.split("/");
      return decodeURIComponent(parts[parts.length - 1] || "");
    }

    function hasDocumentValue(rawValue) {
      if (rawValue === null || rawValue === undefined) return false;
      const text = String(rawValue).trim();
      if (!text) return false;
      const normalized = text.toLowerCase();
      if (["null", "none", "na", "n/a", "not available", "not uploaded", "no document"].includes(normalized)) {
        return false;
      }
      return true;
    }

    function resolveDocumentStoredValue(field, rawValue, sourceKey) {
      if (hasDocumentValue(rawValue)) {
        return String(rawValue || "").trim();
      }

      const keyCandidates = [];
      const seenKeys = new Set();
      function addKeyCandidate(value) {
        const key = String(value || "").trim();
        if (!key) return;
        const marker = key.toLowerCase();
        if (seenKeys.has(marker)) return;
        seenKeys.add(marker);
        keyCandidates.push(key);
      }

      addKeyCandidate(field?.name);
      addKeyCandidate(sourceKey);
      const keys = Array.isArray(field?.keys) ? field.keys : [];
      keys.forEach((key) => addKeyCandidate(key));

      const valueCandidates = [];
      const seenValueMarkers = new Set();
      function addValueCandidate(value) {
        const text = String(value || "").trim();
        if (!text) return;
        const marker = text.toLowerCase();
        if (seenValueMarkers.has(marker)) return;
        seenValueMarkers.add(marker);
        valueCandidates.push(text);
      }

      keyCandidates.forEach((baseKey) => {
        [
          baseKey,
          `${baseKey}_FileName`,
          `${baseKey}FileName`,
          `${baseKey}_filename`,
          `${baseKey}filename`,
        ].forEach((candidateKey) => {
          if (!Object.prototype.hasOwnProperty.call(currentVendor || {}, candidateKey)) return;
          addValueCandidate(currentVendor[candidateKey]);
        });
      });

      return valueCandidates.find((candidate) => hasDocumentValue(candidate)) || "";
    }

    function parseOptionLines(rawText) {
      return String(rawText || "")
        .split(/\r?\n/)
        .map((line) => line.trim())
        .filter((line) => line !== "");
    }

    const INCO_TERMS_OPTIONS = parseOptionLines(`
CFR - Costs and freight
CIF - Costs, insurance & freight
CIP - Carriage and insurance paid to
CPT - Carriage paid to
DAP - Delivered At Place
DAT - Delivered At Terminal
DDP - Delivered Duty Paid
DDU - Delivered Duty Unpaid
DPU - Delivered at Place Unloaded
EXW - Ex Works
FAS - Free Alongside Ship
FCA - Free Carrier
FOB - Free on board
UN - Not Free
    `);

    const PAYMENT_TERMS_OPTIONS = [
      "001 - CREDIT - WITHIN 60 DAYS OF RECEIPT BY CUSTOMER",
      "002 - CREDIT - WITHIN 45 DAYS OF RECEIPT BY CUSTOMER",
      "003 - CREDIT - WITHIN 30 DAYS OF RECEIPT BY CUSTOMER",
      "005 - CREDIT - WITHIN 15 DAYS OF RECEIPT BY CUSTOMER",
      "006 - CREDIT - WITHIN 10 DAYS OF RECEIPT BY CUSTOMER",
      "007 - CREDIT - WITHIN 15 DAYS OF DISPATCH",
      "008 - 100% AGANIST DELIVERY",
      "012 - CREDIT - WITHIN 30 DAYS OF DISPATCH",
      "015 - CREDIT - WITHIN 50 DAYS OF RECEIPT BY CUSTOMER",
      "024 - CREDIT - WITHIN 60 DAYS OF DISPATCH",
      "025 - CREDIT - WITHIN 45 DAYS OF DISPATCH",
      "039 - CREDIT - WITHIN 50 DAYS OF DESPATCH",
      "044 - L/C - AT SIGHT",
      "048 - 100 % AGAINST COMPLETION OF JOB-WORK",
      "053 - 100% AGAINST LORRY RECEIPT",
      "056 - ADV - 20%, BAL- 80% AFTER 30 DAYS OF DISPATCH",
      "066 - 100% AGAINST DISPATCH DOCUMENTS",
      "071 - PAYMENT - 60 DAYS HUNDI",
      "072 - D/A 180 DAYS",
      "073 - L/C - 45 DAYS",
      "074 - ADVANCE - 50%, BALANCE - 50% AGAINST DELIVERY",
      "076 - D/A 30 DAYS",
      "080 - 100% AGAINST PROFORMA INVOICE",
      "081 - D/A 90 DAYS",
      "090 - 100% AGAINST REQUESTED DOCUMENTS AS PER CONTRACT",
      "092 - D/A 60 DAYS",
      "095 - CAD - 70% , BALANCE - 30% WITHIN 60 DAYS OF B/L",
      "096 - D/P AT SIGHT",
      "097 - CAD - 100%",
      "098 - D/A 120 DAYS",
      "099 - L/C - 90 DAYS",
      "100 - L/C - 120 DAYS",
      "107 - D/A 15 DAYS",
      "109 - D/A 45 DAYS",

      const parts = token.split(".");

      try {
        const normalizedPayload = parts[1].replace(/-/g, "+").replace(/_/g, "/");
        const paddedPayload = normalizedPayload + "=".repeat((4 - (normalizedPayload.length % 4)) % 4);

        }
        if (parsed !== null && parsed !== undefined && typeof parsed !== "object") {
          return String(parsed).trim();
        }
      } catch (_) {}

      if (raw.startsWith("[") && raw.endsWith("]")) {
        const first = raw
          .slice(1, -1)
          .split(",")
          .map((item) => item.trim().replace(/^['"]+|['"]+$/g, ""))
          .find(Boolean);
        return first || "";
      }

      return raw.replace(/^['"]+|['"]+$/g, "");
    }

    function getDistributionChannelOptions(salesOrganizationValue) {
      const salesValue = String(salesOrganizationValue || "").trim();
      if (!salesValue) return [];
      return normalizeOptions(DISTRIBUTION_CHANNEL_MAP[salesValue] || []);

    function getDivisionOptions(salesOrganizationValue, distributionChannelValue) {
      const salesValue = String(salesOrganizationValue || "").trim();
      const distributionValue = String(distributionChannelValue || "").trim();
      if (!salesValue || !distributionValue) return [];
      return normalizeOptions((DIVISION_MAP[salesValue] || {})[distributionValue] || []);

    function getTeamSelectOptions(field, selectedValue) {

      const distributionChannelValue = String(field?.distributionChannelValue || "").trim();

      let options = [];

        options = normalizeOptions(INCO_TERMS_OPTIONS);

      } else if (optionsType === "customerGroup") {
        options = normalizeOptions(CUSTOMER_GROUP_OPTIONS);
      } else if (optionsType === "industryType") {
        options = normalizeOptions(INDUSTRY_TYPE_OPTIONS);
      } else if (optionsType === "salesOrganization") {
        options = normalizeOptions(SALES_ORGANIZATION_OPTIONS);
      } else if (optionsType === "distributionChannel") {
        options = getDistributionChannelOptions(salesOrganizationValue);
      } else if (optionsType === "division") {

      } else if (optionsType === "accountAssignment") {

    const previewBlobUrlById = new Map();

    function releasePreviewBlobUrl(previewEl) {
      const previewId = String(previewEl?.id || "").trim();
      if (!previewId) return;
      const blobUrl = previewBlobUrlById.get(previewId);
      if (!blobUrl) return;
      try {
        URL.revokeObjectURL(blobUrl);
      } catch (_) {}
      previewBlobUrlById.delete(previewId);
    }

    function releaseAllPreviewBlobUrls() {
      previewBlobUrlById.forEach((blobUrl) => {
        try {
          URL.revokeObjectURL(blobUrl);
        } catch (_) {}
      });
      previewBlobUrlById.clear();
    }

    function isSameOriginUrl(urlValue) {
      const text = String(urlValue || "").trim();
      if (!text) return false;
      try {
        const parsed = new URL(text, window.location.origin);
        return parsed.origin === window.location.origin;
      } catch (_) {
        return false;
      }
    }

    function hasBytesPrefix(sourceBytes, prefixBytes) {
      if (!sourceBytes || sourceBytes.length < prefixBytes.length) return false;
      for (let i = 0; i < prefixBytes.length; i += 1) {
        if (sourceBytes[i] !== prefixBytes[i]) return false;
      }
      return true;
    }

    async function sniffBlobContentType(blob, fallbackContentType = "") {
      const normalizedFallback = String(fallbackContentType || "")
        .split(";", 1)[0]
        .trim()
        .toLowerCase();
      const genericTypes = new Set([
        "",
        "application/octet-stream",
        "binary/octet-stream",
        "application/download",
        "application/x-download",
        "text/plain",
        "application/plain",
      ]);

      if (!genericTypes.has(normalizedFallback)) {
        return normalizedFallback;
      }

      try {
        const headerBuffer = await blob.slice(0, 4096).arrayBuffer();
        const header = new Uint8Array(headerBuffer);
        if (!header.length) return normalizedFallback;

        const headerText = new TextDecoder("latin1").decode(header).toLowerCase();
        if (headerText.includes("%pdf")) return "application/pdf";
        if (hasBytesPrefix(header, [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a])) return "image/png";
        if (hasBytesPrefix(header, [0xff, 0xd8, 0xff])) return "image/jpeg";
        if (hasBytesPrefix(header, [0x47, 0x49, 0x46, 0x38, 0x37, 0x61])) return "image/gif";
        if (hasBytesPrefix(header, [0x47, 0x49, 0x46, 0x38, 0x39, 0x61])) return "image/gif";
        if (hasBytesPrefix(header, [0x42, 0x4d])) return "image/bmp";
        if (
          hasBytesPrefix(header, [0x52, 0x49, 0x46, 0x46])
          && header.length >= 12
          && header[8] === 0x57
          && header[9] === 0x45
          && header[10] === 0x42
          && header[11] === 0x50
        ) {
          return "image/webp";
        }
        if (headerText.includes("<svg")) return "image/svg+xml";
      } catch (_) {
        return normalizedFallback;
      }

      return normalizedFallback;
    }

    async function fetchDocumentPreviewBlob(docUrl) {
      const token = String(sessionStorage.getItem("token") || "").trim();
      const headers = token ? { "Authorization": `Bearer ${token}` } : {};
      let response = await fetch(docUrl, { headers });
      if (!response.ok && token && (response.status === 401 || response.status === 403)) {
        response = await fetch(docUrl);
      }
      if (!response.ok) {
        throw new Error(`Document preview failed (${response.status})`);
      }
      const blob = await response.blob();
      const contentType = String(response.headers.get("content-type") || "")
        .split(";", 1)[0]
        .trim()
        .toLowerCase();
      const resolvedContentType = await sniffBlobContentType(blob, contentType);
      let previewBlob = blob;
      if (resolvedContentType && blob.type !== resolvedContentType) {
        try {
          previewBlob = blob.slice(0, blob.size, resolvedContentType);
        } catch (_) {
          previewBlob = new Blob([blob], { type: resolvedContentType });
        }
      }
      return { blob: previewBlob, contentType: resolvedContentType };
    }

    function buildPdfDocumentUrl(docUrl) {
      const text = String(docUrl || "").trim();
      if (!text) return "";
      try {
        const parsed = new URL(text, window.location.origin);
        if (
          parsed.origin === window.location.origin
          && (parsed.pathname === "/api/vendor/document" || parsed.pathname === "/api/customer/document")
        ) {
          parsed.pathname = `${parsed.pathname}/pdf`;
          return parsed.toString();
        }
      } catch (_) {}
      return text;
    }

    function getPdfJs() {
      const pdfjs = window.pdfjsLib;
      if (!pdfjs) return null;
      if (pdfjs.GlobalWorkerOptions && !pdfjs.GlobalWorkerOptions.workerSrc) {
        pdfjs.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      }
      return pdfjs;
    }

    async function fetchPdfBytes(pdfUrl) {
      const token = String(sessionStorage.getItem("token") || "").trim();
      const headers = token ? { "Authorization": `Bearer ${token}` } : {};
      let response = await fetch(pdfUrl, { headers });
      if (!response.ok && token && (response.status === 401 || response.status === 403)) {
        response = await fetch(pdfUrl);
      }
      if (!response.ok) {
        throw new Error(`PDF preview failed (${response.status})`);
      }
      return new Uint8Array(await response.arrayBuffer());
    }

    async function renderPdfDocumentPreview(previewEl, pdfUrl, openUrl) {
      const pdfjs = getPdfJs();
      let bodyHtml = `<div class="doc-actions"><a href="${escapeHtml(openUrl || pdfUrl)}" target="_blank" rel="noopener noreferrer">Open In New Page</a></div>`;
      bodyHtml += `<div class="pdf-js-viewer" data-pdf-viewer><div class="pdf-js-status">Loading PDF...</div></div>`;
      previewEl.innerHTML = bodyHtml;
      previewEl.classList.remove("hidden");

      const viewerEl = previewEl.querySelector("[data-pdf-viewer]");
      if (!viewerEl) return;
      if (!pdfjs) {
        viewerEl.innerHTML = `<div class="pdf-js-status">PDF viewer could not load. Use Open In New Page.</div>`;
        return;
      }

      try {
        const pdfData = await fetchPdfBytes(pdfUrl);
        const pdfDocument = await pdfjs.getDocument({ data: pdfData }).promise;
        const totalPages = Number(pdfDocument.numPages || 0);
        if (!totalPages) {
          throw new Error("PDF has no pages");
        }
        viewerEl.innerHTML = "";
        const availableWidth = Math.max(320, viewerEl.clientWidth - 36);

        for (let pageNumber = 1; pageNumber <= totalPages; pageNumber += 1) {
          const page = await pdfDocument.getPage(pageNumber);
          const baseViewport = page.getViewport({ scale: 1 });
          const scale = Math.min(2, Math.max(0.75, availableWidth / baseViewport.width));
          const viewport = page.getViewport({ scale });
          const outputScale = Math.max(1, window.devicePixelRatio || 1);

          const pageEl = document.createElement("div");
          pageEl.className = "pdf-js-page";
          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(viewport.width * outputScale);
          canvas.height = Math.floor(viewport.height * outputScale);
          canvas.style.width = `${Math.floor(viewport.width)}px`;
          canvas.style.height = `${Math.floor(viewport.height)}px`;
          pageEl.appendChild(canvas);
          viewerEl.appendChild(pageEl);

          const context = canvas.getContext("2d");
          if (!context) {
            throw new Error("PDF canvas is not available");
          }
          context.setTransform(outputScale, 0, 0, outputScale, 0, 0);
          await page.render({ canvasContext: context, viewport }).promise;
        }
      } catch (err) {
        viewerEl.innerHTML = `<div class="pdf-js-status">${escapeHtml(err?.message || "Unable to render PDF preview.")}</div>`;
      }
    }

    async function renderDocumentPreview(previewEl, docUrl, docName = "") {
      releasePreviewBlobUrl(previewEl);

      const lower = String(docName || docUrl).toLowerCase().split("?")[0];
      const openUrl = String(docUrl || "").trim();
      const looksLikePdf = /\.pdf$/i.test(lower);
      if (looksLikePdf) {
        await renderPdfDocumentPreview(previewEl, buildPdfDocumentUrl(openUrl), openUrl);
        return;
      }
      let previewUrl = openUrl;
      let resolvedContentType = "";

      if (openUrl && isSameOriginUrl(openUrl)) {
        try {
          const { blob, contentType } = await fetchDocumentPreviewBlob(openUrl);
          resolvedContentType = contentType;
          const blobUrl = URL.createObjectURL(blob);
          previewBlobUrlById.set(String(previewEl.id || ""), blobUrl);
          previewUrl = blobUrl;
        } catch (_) {
          resolvedContentType = "";
          previewUrl = openUrl;
        }
      }

      const isImage =
        /^image\//.test(resolvedContentType)
        || /\.(png|jpg|jpeg|gif|webp|bmp|svg)$/.test(lower);
      const isPdf = resolvedContentType === "application/pdf";

      let bodyHtml = `<div class="doc-actions"><a href="${escapeHtml(openUrl)}" target="_blank" rel="noopener noreferrer">Open In New Page</a></div>`;

      if (isImage) {
        bodyHtml += `<img src="${escapeHtml(previewUrl)}" alt="Uploaded Document Preview" />`;
      } else if (isPdf) {
        await renderPdfDocumentPreview(previewEl, buildPdfDocumentUrl(openUrl || previewUrl), openUrl || previewUrl);
        return;
      } else {
        bodyHtml += `<iframe src="${escapeHtml(previewUrl)}" title="Document Preview"></iframe>`;
      }

      previewEl.innerHTML = bodyHtml;
      previewEl.classList.remove("hidden");
    }

    function bindDocumentToggles() {
      const toggles = document.querySelectorAll("[data-doc-toggle]");
      toggles.forEach((toggle) => {
        toggle.addEventListener("change", async () => {
          const previewId = String(toggle.dataset.previewId || "");
          const previewEl = document.getElementById(previewId);
          if (!previewEl) return;

          if (!toggle.checked) {
            releasePreviewBlobUrl(previewEl);
            previewEl.classList.add("hidden");
            previewEl.innerHTML = "";
            return;
          }

          const docUrl = String(toggle.dataset.docUrl || "").trim();
          const docName = String(toggle.dataset.docName || "").trim();
          if (!docUrl) {
            releasePreviewBlobUrl(previewEl);
            previewEl.classList.remove("hidden");
            previewEl.innerHTML = `<div class="muted">No Document</div>`;
            return;
          }

          await renderDocumentPreview(previewEl, docUrl, docName);
        });
      });
    }

    function showGstFilingModal({
      title = "GST Return Filing Details",
      metaHtml = "",
      bodyHtml = "",
      controlsVisible = false,
    } = {}) {
      const { modal, title: titleEl, meta, controls, body } = getGstFilingModalElements();
      if (!modal || !titleEl || !meta || !body) return;
      titleEl.textContent = String(title || "GST Return Filing Details");
      meta.innerHTML = metaHtml;
      if (controls) {
        controls.classList.toggle("hidden", !controlsVisible);

      body.innerHTML = bodyHtml;
      modal.classList.remove("hidden");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeGstFilingModal(resetToggle = true) {
      const { modal, meta, controls, financialYearSelect, body } = getGstFilingModalElements();
      if (!modal || !meta || !body) return;
      modal.classList.add("hidden");
      modal.setAttribute("aria-hidden", "true");
      meta.innerHTML = "";
      if (controls) {
        controls.classList.add("hidden");
      }
      if (financialYearSelect) {
        financialYearSelect.innerHTML = "";
      }
      body.innerHTML = "";
      currentGstFilingContext = { recordId: "", gstNumber: "", financialYear: "" };

        setGstFilingToggleState(false);
      }
    }

    function cancelGstFilingRequestAndClose(resetToggle = true) {
      currentGstFilingRequestId += 1;
      closeGstFilingModal(resetToggle);
    }

    function buildFinancialYearOptions(yearCount = 11) {
      const now = new Date();
      const monthIndex = now.getMonth();
      const currentYear = now.getFullYear();
      const currentFyStart = monthIndex >= 3 ? currentYear : currentYear - 1;
      const options = [];
      for (let index = 0; index < yearCount; index += 1) {
        const startYear = currentFyStart - index;
        const endYearTwoDigits = String((startYear + 1) % 100).padStart(2, "0");
        const value = `${startYear}-${endYearTwoDigits}`;
        options.push({ value, label: value });
      }
      return options;
    }

    function populateGstFilingFinancialYearSelect(selectedValue = "") {
      const { financialYearSelect } = getGstFilingModalElements();
      if (!financialYearSelect) return "";
      const options = buildFinancialYearOptions(11);
      const fallbackValue = options[0]?.value || "";
      const targetValue = String(selectedValue || "").trim() || fallbackValue;
      financialYearSelect.innerHTML = options
        .map((item) => `<option value="${escapeHtml(item.value)}">${escapeHtml(item.label)}</option>`)
        .join("");
      financialYearSelect.value = options.some((item) => item.value === targetValue)
        ? targetValue
        : fallbackValue;
      return String(financialYearSelect.value || "");
    }

    function buildGstFilingMetaHtml(result, gstNumber, financialYear = "") {
      const tradeName = String(result?.["Trade Name"] || "").trim();
      const taxpayerType = String(result?.["Taxpayer Type"] || "").trim();
      const status = String(result?.["GSTIN / UIN  Status"] || "").trim();
      const items = [
        `<span class="badge">GST Number: ${escapeHtml(gstNumber || "N/A")}</span>`,
      ];
      if (financialYear) {
        items.push(`<span class="badge">Financial Year: ${escapeHtml(financialYear)}</span>`);
      }
      if (tradeName) items.push(`<span class="badge">Trade Name: ${escapeHtml(tradeName)}</span>`);
      if (taxpayerType) items.push(`<span class="badge">Taxpayer Type: ${escapeHtml(taxpayerType)}</span>`);
      if (status) items.push(`<span class="badge">GST Status: ${escapeHtml(status)}</span>`);
      return items.join("");
    }

    function buildGstFilingTableHtml(table, index) {
      const title = String(table?.title || `Table ${index + 1}`).trim() || `Table ${index + 1}`;
      const headers = Array.isArray(table?.headers) ? table.headers.map((item) => String(item || "").trim()) : [];
      const rows = Array.isArray(table?.rows)
        ? table.rows
            .map((row) => (Array.isArray(row) ? row.map((item) => String(item ?? "")) : []))
            .filter((row) => row.length)
        : [];
      const columnCount = Math.max(
        headers.length,
        rows.reduce((maxCount, row) => Math.max(maxCount, row.length), 0)
      );
      const normalizedHeaders = headers.length
        ? headers
        : Array.from({ length: columnCount }, (_, headerIndex) => `Column ${headerIndex + 1}`);

      const headHtml = normalizedHeaders.length
        ? `<thead><tr>${normalizedHeaders.map((header) => `<th>${escapeHtml(header)}</th>`).join("")}</tr></thead>`
        : "";
      const bodyHtml = rows.length
        ? `<tbody>${rows.map((row) => `<tr>${normalizedHeaders.map((_, cellIndex) => `<td>${escapeHtml(row[cellIndex] || "")}</td>`).join("")}</tr>`).join("")}</tbody>`
        : `<tbody><tr><td colspan="${Math.max(normalizedHeaders.length, 1)}" class="gst-filing-empty">No rows available.</td></tr></tbody>`;

      return `
        <div class="gst-filing-table-card">
          <h4>${escapeHtml(title)}</h4>
          <div class="gst-filing-table-wrap">
            <table class="gst-filing-table">
              ${headHtml}
              ${bodyHtml}
            </table>
          </div>
        </div>
      `;
    }

    function renderGstFilingResult(result, gstNumber, financialYear = "") {
      const tables = Array.isArray(result?.["Filing Tables"]) ? result["Filing Tables"] : [];
      const filingMessage = String(result?.["Filing Message"] || "").trim();
      const metaHtml = buildGstFilingMetaHtml(result, gstNumber, financialYear);
      const status = normalizeStatusText(result?.["GSTIN / UIN  Status"]);
      let bodyHtml = "";

      if (!tables.length) {
        if (filingMessage) {
          bodyHtml = `<div class="gst-filing-empty">${escapeHtml(filingMessage)}</div>`;
        } else {
          bodyHtml = `<div class="gst-filing-empty">${
            status && status !== "valid" && status !== "active"
              ? `GST filing-table extraction did not complete successfully. Current GST status: ${escapeHtml(String(result?.["GSTIN / UIN  Status"] || "Unknown"))}.`
              : "No GST filing-table data is available for this GST number."
          }</div>`;
        }
      } else {
        bodyHtml = tables.map((table, index) => buildGstFilingTableHtml(table, index)).join("");
      }

      showGstFilingModal({
        metaHtml,
        bodyHtml,
        controlsVisible: true,
      });
    }

    function buildGstFilingCacheKey(recordId, gstNumber, financialYear) {
      return `customer:${String(recordId || "").trim()}:${String(gstNumber || "").trim()}:${String(financialYear || "").trim()}`;
    }

    async function fetchGstFilingTable(recordId, financialYear) {
      const token = String(sessionStorage.getItem("token") || "").trim();
      const headers = token ? { "Authorization": `Bearer ${token}` } : {};
      const query = new URLSearchParams();
      query.set("recordId", String(recordId || "").trim());
      if (String(financialYear || "").trim()) {
        query.set("financialYear", String(financialYear || "").trim());
      }
      const res = await fetch(`/api/customer/gst-filing-table?${query.toString()}`, { headers });
      const data = await parseApiResponse(res);
      if (!res.ok) {
        throw new Error(data.detail || "Unable to load GST filing-table details");
      }
      return data;
    }

    async function fetchAndRenderGstFilingTables() {
      const recordId = String(currentGstFilingContext.recordId || "").trim();
      const gstNumber = String(currentGstFilingContext.gstNumber || "").trim();
      const { financialYearSelect, fetchBtn } = getGstFilingModalElements();

          metaHtml: `<span class="badge">GST Number: ${escapeHtml(gstNumber || "N/A")}</span>`,
          bodyHtml: `<div class="gst-filing-empty">GST context is missing. Please reopen filing table view.</div>`,
          controlsVisible: true,
        });
        return;
      }
      if (!selectedFinancialYear) {
        showGstFilingModal({
          metaHtml: `<span class="badge">GST Number: ${escapeHtml(gstNumber)}</span>`,
          bodyHtml: `<div class="gst-filing-empty">Please select Financial Year.</div>`,
          controlsVisible: true,
        });
        return;
      }

      currentGstFilingContext.financialYear = selectedFinancialYear;
      const requestId = currentGstFilingRequestId + 1;
      currentGstFilingRequestId = requestId;
      const cacheKey = buildGstFilingCacheKey(recordId, gstNumber, selectedFinancialYear);
      if (fetchBtn) fetchBtn.disabled = true;

      showGstFilingModal({
        metaHtml: buildGstFilingMetaHtml({}, gstNumber, selectedFinancialYear),
        bodyHtml: `<div class="gst-filing-empty">Loading GST filing-table details...</div>`,
        controlsVisible: true,
      });
      populateGstFilingFinancialYearSelect(selectedFinancialYear);

      try {
        let payload = gstFilingCacheByRecord.get(cacheKey);
        if (!payload) {
          payload = await fetchGstFilingTable(recordId, selectedFinancialYear);
          gstFilingCacheByRecord.set(cacheKey, payload);
        }
        if (requestId !== currentGstFilingRequestId) {
          return;
        }
        const responseFinancialYear = String(
          payload?.financialYear || selectedFinancialYear
        ).trim() || selectedFinancialYear;
        currentGstFilingContext.financialYear = responseFinancialYear;
        renderGstFilingResult(payload?.result || {}, payload?.gstNumber || gstNumber, responseFinancialYear);
        populateGstFilingFinancialYearSelect(responseFinancialYear);
      } catch (err) {
        if (requestId !== currentGstFilingRequestId) {
          return;
        }
        showGstFilingModal({
          metaHtml: buildGstFilingMetaHtml({}, gstNumber, selectedFinancialYear),
          bodyHtml: `<div class="gst-filing-empty">${escapeHtml(err?.message || "Unable to load GST filing-table details.")}</div>`,
          controlsVisible: true,
        });
        populateGstFilingFinancialYearSelect(selectedFinancialYear);
      } finally {
        if (fetchBtn) fetchBtn.disabled = false;
      }
    }

    function normalizeStatusValue(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/[._-]+/g, " ")
        .replace(/\s+/g, " ");
    }

    function isNegativeStatusValue(value) {
      const normalized = normalizeStatusValue(value);
      if (!normalized) return false;
      if (NEGATIVE_STATUS_VALUES.has(normalized)) return true;
      if (normalized.startsWith("not ")) return true;
      return normalized.includes("not registered") || normalized.includes("unregistered");
    }

    function fieldHasAnyKey(field, keys) {
      const fieldKeys = Array.isArray(field?.keys) ? field.keys : [];
      const normalizedFieldKeys = fieldKeys.map((item) => String(item || "").trim().toLowerCase()).filter(Boolean);
      return (Array.isArray(keys) ? keys : []).some((item) => normalizedFieldKeys.includes(String(item || "").trim().toLowerCase()));
    }

    function shouldHideFieldByNegativeStatus(card, field, vendor) {
      const cardTitle = String(card?.title || "").trim();
      const rules = NEGATIVE_STATUS_RULES[cardTitle] || [];
      if (!rules.length) return false;

      for (const rule of rules) {
        const resolvedStatus = pickWithSource(vendor, rule.statusKeys || [], "");
        if (!isNegativeStatusValue(resolvedStatus.value)) continue;
        if (fieldHasAnyKey(field, rule.dependentKeys || [])) return true;
      }
      return false;
    }

      let activeToast = null;
      let activeTimer = null;

      function removeToast(toast) {
        if (!toast) return;
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 200);
        if (activeToast === toast) activeToast = null;
      }

      return function showToast(text, kind = "info", duration = 10000) {
        if (!text) return;
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        if (activeToast) {
          activeToast.remove();
          activeToast = null;
        }

        const colors = { ok: "#166534", err: "#b91c1c", info: "#2454d9" };
        const toast = document.createElement("div");
        toast.textContent = text;
        toast.style.width = "min(390px, calc(100vw - 36px))";
        toast.style.maxWidth = "calc(100vw - 36px)";
        toast.style.padding = "18px 20px";
        toast.style.borderRadius = "12px";
        toast.style.boxShadow = "0 12px 28px rgba(15, 23, 42, 0.22)";
        toast.style.background = colors[kind] || colors.info;
        toast.style.color = "#fff";
        toast.style.fontSize = "16px";
        toast.style.fontWeight = "700";
        toast.style.lineHeight = "1.35";
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        toast.style.transition = "opacity .2s ease, transform .2s ease";

        host.appendChild(toast);
        requestAnimationFrame(() => {
          toast.style.opacity = "1";
          toast.style.transform = "translateY(0)";
        });

        activeToast = toast;
        if (duration > 0) {
          activeTimer = setTimeout(() => removeToast(toast), duration);
        }
      };
    }

    async function loadHodOptions(token, selectedValue = "") {
      try {
        const headers = token ? { "Authorization": `Bearer ${token}` } : {};
        const res = await fetch("/api/customer/get-hod-emails", { headers });
        const data = await parseApiResponse(res);
        if (!res.ok || !Array.isArray(data)) {
          throw new Error(data.detail || "Unable to load HOD options");
        }
        hodOptions = data
          .map((item) => {
            const email = String(item?.email || "").trim();
            const name = String(item?.name || "").trim();
            if (!email) return null;
            return {
              value: email,
              label: name ? `${name} (${email})` : email,
            };
          })
          .filter(Boolean);
      } catch (_) {
        hodOptions = [];
      }

      const selected = String(selectedValue || "").trim();
      if (selected && !hodOptions.some((item) => String(item.value || "").trim() === selected)) {
        hodOptions.unshift({ value: selected, label: selected });
      }
    }

      if (!selectEl) return;
      const normalized = Array.isArray(options) ? options : [];
      const selected = String(selectedValue || "").trim();
      const merged = withSelectedOption(normalized, selected);
      const optionsHtml = ['<option value="">', escapeHtml(placeholder), "</option>"]
        .join("")
        .concat(
          merged
            .map((item) => {
              const value = String(item.value || "");
              const label = String(item.label || value);
              const selectedAttr = value === selected ? " selected" : "";
              return `<option value="${escapeHtml(value)}"${selectedAttr}>${escapeHtml(label)}</option>`;
            })
            .join("")
        );
      selectEl.innerHTML = optionsHtml;
      if (selected && merged.some((item) => String(item.value || "").trim() === selected)) {
        selectEl.value = selected;

      const divisionField = document.querySelector('[data-team-field="true"][data-field-name="division"]');
      if (!salesField || !distributionField || !divisionField) return;

      const salesValue = String(salesField.value || "").trim();
      const distributionCurrent = String(distributionField.value || "").trim();
      const distributionOptions = getDistributionChannelOptions(salesValue);
      const hasDistribution = distributionOptions.some(
        (item) => String(item.value || "").trim() === distributionCurrent
      );
      const distributionNext = (clearInvalidValues && distributionCurrent && !hasDistribution)
        ? ""
        : distributionCurrent;
      setTeamSelectOptions(
        distributionField,
        distributionOptions,
        distributionNext,
        salesValue ? "Select" : "Select Sales Organization First"
      );

      const distributionValue = String(distributionField.value || "").trim();
      const divisionCurrent = String(divisionField.value || "").trim();
      const divisionOptions = getDivisionOptions(salesValue, distributionValue);
      const hasDivision = divisionOptions.some(
        (item) => String(item.value || "").trim() === divisionCurrent
      );
      const divisionNext = (clearInvalidValues && divisionCurrent && !hasDivision)
        ? ""
        : divisionCurrent;
      const divisionPlaceholder = salesValue
        ? (distributionValue ? "Select" : "Select Distribution Channel First")
        : "Select Sales Organization First";
      setTeamSelectOptions(divisionField, divisionOptions, divisionNext, divisionPlaceholder);
    }

    function applyApproveRequiredUi(approveSelected) {
      if (isHistoryMode) return;
      const shouldRequire = !isValidatorUser && approveSelected;
      TEAM_REQUIRED_FIELDS.forEach((fieldName) => {
        const field = document.querySelector(`[data-team-field="true"][data-field-name="${fieldName}"]`);
        if (!field) return;

        if (shouldRequire) {
          field.setAttribute("required", "required");
        } else {
          field.removeAttribute("required");
        }

        const row = field.closest(".row");
        const label = row ? row.querySelector("label") : null;
        if (!label) return;
        let star = label.querySelector(".req-star");
        if (!star) {
          star = document.createElement("span");
          star.className = "req-star";
          star.textContent = "*";
          label.appendChild(star);
        }
        star.classList.toggle("hidden", !shouldRequire);
      });
    }

      return TEAM_REQUIRED_FIELDS.every((fieldName) => {
        const field = document.querySelector(`[data-team-field="true"][data-field-name="${fieldName}"]`);
        return !!field && String(field.value || "").trim() !== "";

    function applyDecisionRoleUi() {
      const rejectToContainer = document.getElementById("validatorRejectToContainer");
      const rejectToRequired = document.getElementById("validatorRejectToRequired");
      if (isHistoryMode) {
        if (rejectToContainer) rejectToContainer.classList.add("hidden");
        if (rejectToRequired) rejectToRequired.classList.add("hidden");
        return;
      }
      const rejectSelected = !!document.getElementById("rejectCheckbox")?.checked;
      const shouldShowRejectTo = supportsRejectTarget && rejectSelected;

      if (rejectToContainer) {
        rejectToContainer.classList.toggle("hidden", !shouldShowRejectTo);
      }
      if (rejectToRequired) {
        rejectToRequired.classList.toggle("hidden", !shouldShowRejectTo);
      }

      if (!shouldShowRejectTo) {
        document.querySelectorAll('input[name="validatorRejectTo"]').forEach((radio) => {
          radio.checked = false;
        });
      }
    }

    function getSelectedRejectTo() {
      const selected = document.querySelector('input[name="validatorRejectTo"]:checked');
      return String(selected?.value || "").trim();
    }

    function normalizeSectionTitle(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function parseSelectedSectionNames(rawValue) {
      if (Array.isArray(rawValue)) {
        return rawValue
          .map((item) => String(item || "").trim())
          .filter(Boolean);
      }
      if (rawValue === null || rawValue === undefined) {
        return [];
      }
      const text = String(rawValue || "").trim();
      if (!text) {
        return [];
      }
      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) {
          return parsed
            .map((item) => String(item || "").trim())
            .filter(Boolean);
        }
      } catch (_) {}

      if (text.startsWith("[") && text.endsWith("]")) {
        return text
          .slice(1, -1)
          .split(",")
          .map((item) => item.trim().replace(/^['"]+|['"]+$/g, ""))
          .filter(Boolean);
      }

      if (text.includes(",")) {
        return text
          .split(",")
          .map((item) => item.trim().replace(/^['"]+|['"]+$/g, ""))
          .filter(Boolean);
      }

      return [text];
    }

    function getSelectedSectionSetFromRecord(vendor) {
      const resolved = pickWithSource(
        vendor || {},
        ["selectedSections", "SelectedSections", "selected_sections"],
        []
      );
      const selectedNames = parseSelectedSectionNames(resolved.value);
      return new Set(selectedNames.map((name) => normalizeSectionTitle(name)).filter(Boolean));
    }

    function shouldRequireValidatorChecksForApprove(vendor) {
      if (!isValidatorUser || isHistoryMode) return false;
      return isPendingForValidatorApproval(vendor || currentVendor);
    }

    function getRequiredValidatorCheckboxIds(vendor) {
      const requiredIds = new Set();
      const selectedSectionSet = getSelectedSectionSetFromRecord(vendor || currentVendor);
      const hasSelectedSections = selectedSectionSet.size > 0;

      Object.entries(VALIDATOR_CARD_CHECKBOXES || {}).forEach(([cardTitle, checks]) => {
        if (hasSelectedSections && !selectedSectionSet.has(normalizeSectionTitle(cardTitle))) {
          return;
        }
        (Array.isArray(checks) ? checks : []).forEach((item) => {
          const id = String(item?.id || "").trim();
          if (!id) return;
          if (document.getElementById(id)) {
            requiredIds.add(id);
          }
        });
      });

      if (!hasSelectedSections && requiredIds.size === 0) {
        (Array.isArray(VALIDATOR_CHECKBOX_FIELDS) ? VALIDATOR_CHECKBOX_FIELDS : []).forEach((field) => {
          const id = String(field?.id || "").trim();
          if (!id) return;
          if (document.getElementById(id)) {
            requiredIds.add(id);
          }
        });
      }
      return Array.from(requiredIds);
    }

    function autoSelectRequiredValidatorChecks(vendor) {
      getRequiredValidatorCheckboxIds(vendor).forEach((id) => {
        const checkbox = document.getElementById(id);
        if (!checkbox) return;
        checkbox.checked = true;
      });
    }

    function areRequiredValidatorChecksSatisfied(vendor) {
      const requiredIds = getRequiredValidatorCheckboxIds(vendor);
      if (!requiredIds.length) return true;
      return requiredIds.every((id) => !!document.getElementById(id)?.checked);
    }

    function syncSubmitButtonState() {
      const approve = document.getElementById("approveCheckbox");
      const reject = document.getElementById("rejectCheckbox");
      const remarks = document.getElementById("decisionRemarks");
      const submitBtn = document.getElementById("submitDecisionBtn");
      if (isHistoryMode) {
        if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.classList.add("hidden");
        }
        return;
      }
      const approveSelected = !!(approve && approve.checked);
      const rejectSelected = !!(reject && reject.checked);
      const hasChoice = approveSelected || rejectSelected;
      const hasRemarks = String(remarks?.value || "").trim() !== "";
      applyApproveRequiredUi(approveSelected);
      applyDecisionRoleUi();

      let roleSpecificValid = true;
      if (supportsRejectTarget) {
        roleSpecificValid = !rejectSelected || !!getSelectedRejectTo();
      } else {
        roleSpecificValid = !approveSelected || areApproveTeamFieldsFilled();
      }
      if (approveSelected && shouldRequireValidatorChecksForApprove(currentVendor)) {
        roleSpecificValid = roleSpecificValid && areRequiredValidatorChecksSatisfied(currentVendor);
      }

      submitBtn.disabled = !(currentRecordId && hasChoice && hasRemarks && roleSpecificValid);
    }

    function collectTeamEdits() {
      if (isValidatorUser || isHistoryMode) return {};
      const edits = {};
      const fields = document.querySelectorAll('[data-team-field="true"][data-field-name]');
      fields.forEach((field) => {
        const fieldName = String(field.dataset.fieldName || "").trim();
        const sourceKey = String(field.dataset.sourceKey || "").trim();
        const value = String(field.value || "").trim();
        if (!fieldName) return;
        edits[fieldName] = value;
        if (sourceKey && sourceKey.toLowerCase() !== fieldName.toLowerCase()) {
          edits[sourceKey] = value;
        }
      });
      return edits;
    }

    function collectMainFieldEdits() {
      if (isHistoryMode) return {};
      const edits = {};
      const fields = document.querySelectorAll('[data-editable-field="true"][data-field-name]');
      fields.forEach((field) => {
        if (String(field.dataset.teamField || "").trim().toLowerCase() === "true") return;
        const fieldName = String(field.dataset.fieldName || "").trim();
        const sourceKey = String(field.dataset.sourceKey || "").trim();
        const value = String(field.value || "").trim();
        if (!fieldName) return;
        edits[fieldName] = value;
        if (sourceKey && sourceKey.toLowerCase() !== fieldName.toLowerCase()) {
          edits[sourceKey] = value;
        }
      });
      return edits;
    }

    function collectValidatorValidations() {
      const values = {};
      VALIDATOR_CHECKBOX_FIELDS.forEach((field) => {
        const input = document.getElementById(field.id);
        values[field.payloadKey] = !!input?.checked;
      });
      return values;
    }

    function collectValidatorTaxDetails() {
      const tcsRateField = document.getElementById("validatorTcsRate");
      const turnoverField = document.getElementById("validatorTurnoverLimit");
      const tcsRate = String(tcsRateField?.value || "").trim();
      const turnoverLimit = String(turnoverField?.value || "").trim();

      return { tcsRate, turnoverLimit };
    }

    function applyValidatorValidationValues(vendor) {
      if (!isValidatorUser || isHistoryMode) return;
      VALIDATOR_CHECKBOX_FIELDS.forEach((field) => {
        const checkbox = document.getElementById(field.id);
        if (!checkbox) return;
        const resolved = pickWithSource(vendor, field.sourceKeys, false);
        checkbox.checked = toBool(resolved.value);
      });
    }

    function bindDecisionControls() {
      const approve = document.getElementById("approveCheckbox");
      const reject = document.getElementById("rejectCheckbox");
      const remarks = document.getElementById("decisionRemarks");
      const submitBtn = document.getElementById("submitDecisionBtn");
      const closeBtn = document.getElementById("closeViewBtn");

      if (isHistoryMode) {
        if (closeBtn) {
          closeBtn.addEventListener("click", closeHistoryPopup);
        }
        syncSubmitButtonState();
        return;
      }

      const onChoiceChange = (changed) => {
        if (changed === approve && approve.checked) {
          reject.checked = false;
          if (shouldRequireValidatorChecksForApprove(currentVendor)) {
            autoSelectRequiredValidatorChecks(currentVendor);
          }
        }
        if (changed === reject && reject.checked) {
          approve.checked = false;
        }
        syncSubmitButtonState();
      };

      approve.addEventListener("change", () => onChoiceChange(approve));
      reject.addEventListener("change", () => onChoiceChange(reject));
      remarks.addEventListener("input", syncSubmitButtonState);
      document.querySelectorAll('input[name="validatorRejectTo"]').forEach((radio) => {
        radio.addEventListener("change", syncSubmitButtonState);
      });
      submitBtn.addEventListener("click", submitDecision);
      syncSubmitButtonState();
    }

    async function submitDecision() {
      if (isHistoryMode) {
        setDecisionMessage("History view is read-only.", "err");
        return;
      }
      const approve = document.getElementById("approveCheckbox");
      const reject = document.getElementById("rejectCheckbox");
      const remarksEl = document.getElementById("decisionRemarks");
      const submitBtn = document.getElementById("submitDecisionBtn");
      const token = sessionStorage.getItem("token");

      if (!token) {
        setDecisionMessage("Please login first.", "err");
        return;
      }

      const decision = approve.checked ? "approve" : (reject.checked ? "reject" : "");
      const remarks = String(remarksEl.value || "").trim();
      if (!decision) {
        setDecisionMessage("Please select Approve or Reject.", "err");
        syncSubmitButtonState();
        return;
      }
      if (!remarks) {
        setDecisionMessage("Remarks are mandatory.", "err");
        syncSubmitButtonState();
        return;
      }
      if (isValidatorUser && decision === "approve" && shouldRequireValidatorChecksForApprove(currentVendor) && !areRequiredValidatorChecksSatisfied(currentVendor)) {
        setDecisionMessage("Please select all required validation checkboxes before Approve.", "err");
        syncSubmitButtonState();
        return;
      }
      if (!isValidatorUser && decision === "approve" && !areApproveTeamFieldsFilled()) {
        setDecisionMessage("Please fill all mandatory Sharp & Tannan Team fields (Insurance Group is optional) for Approve.", "err");
        syncSubmitButtonState();
        return;
      }
      const rejectTo = getSelectedRejectTo();
      if (supportsRejectTarget && decision === "reject" && !rejectTo) {
        setDecisionMessage("Please select Reject To: Customer or Buyer.", "err");
        syncSubmitButtonState();
        return;
      }

      const payload = {
        recordId: currentRecordId,
        decision,
        remarks,
        approvalMode: getApprovalRedirectMode(),
        fieldUpdates: collectMainFieldEdits(),
      };
      if (isValidatorUser) {
        payload.validations = collectValidatorValidations();
        payload.taxDetails = collectValidatorTaxDetails();
        if (decision === "reject") {
          payload.rejectTo = rejectTo;
        }
      } else {
        payload.team = collectTeamEdits();
        if (isHodUser && decision === "reject") {
          payload.rejectTo = rejectTo;
        }
      }

      setDecisionMessage("Submitting decision...");
      showToast(
        decision === "approve"
          ? "Processing approval, validation, mail and SAP..."
          : "Processing rejection and sending mail...",
        "info",
        0
      );
      submitBtn.disabled = true;
      try {
        const reviewEndpoint = "/api/customer/review-decision";
        const res = await fetch(reviewEndpoint, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
          body: JSON.stringify(payload),
        });
        const data = await parseApiResponse(res);
        if (!res.ok) {
          throw new Error(data.detail || "Unable to submit decision");
        }

        currentRecordId = String(data.recordId || currentRecordId || "").trim();
        currentVendor = data.vendor || currentVendor;
        renderMeta(currentVendor, currentRecordId);
        renderViewSections(currentVendor);
        applyValidatorValidationValues(currentVendor);
        const warningParts = [];
        const sapError = String(data.sapTemplateError || "").trim();
        const uploadError = String(data.vendorUploadError || "").trim();
        const sapLogonError = String(data.sapLogonError || "").trim();
        const sapAutoLogonError = String(data.sapAutoLogonError || "").trim();
        const sapTransactionError = String(data.sapTransactionError || "").trim();
        const refreshMode = String(data?.vendorUploadSync?.refreshMode || "").trim();
        const refreshWarning = String(data?.vendorUploadSync?.refreshWarning || "").trim();
        if (sapError) warningParts.push(`SAP template error: ${sapError}`);
        if (uploadError) warningParts.push(`Vendor upload error: ${uploadError}`);
        if (sapLogonError) warningParts.push(`SAP Logon error: ${sapLogonError}`);
        if (sapAutoLogonError) warningParts.push(`SAP login error: ${sapAutoLogonError}`);
        if (sapTransactionError) warningParts.push(`SAP transaction error: ${sapTransactionError}`);
        if (refreshMode && refreshMode !== "com_refresh") {
          warningParts.push(`Vendor upload sync mode: ${refreshMode}`);
        }
        if (refreshWarning) warningParts.push(refreshWarning);

        if (warningParts.length) {
          setDecisionMessage(
            `Submitted successfully. Status: ${data.approverStatus || ""}. Warnings: ${warningParts.join(" | ")}`,
            "err"
          );
          showToast(`Submitted with warning. ${warningParts.join(" | ")}`, "err");
        } else {
          setDecisionMessage(`Submitted successfully. Status: ${data.approverStatus || ""}`, "ok");
          showToast(`Submitted successfully. Status: ${data.approverStatus || ""}`, "ok");
        }
        setMessage("Review decision submitted successfully.", "ok");
        setTimeout(redirectToApprovalTable, 900);
      } catch (err) {
        setDecisionMessage(err.message || "Unable to submit decision.", "err");
        showToast(err.message || "Unable to submit decision.", "err");
      } finally {
        syncSubmitButtonState();
      }
    }

    async function loadVendorView() {
      const recordId = pageRecordId;
      const token = sessionStorage.getItem("token");

      if (!recordId) {
        setMessage("Record ID is required to view customer details.", "err");
        return;
      }

      setMessage("Loading customer details...");
      setDecisionMessage("");
      try {
        const endpoint = `/api/customer/record?recordId=${encodeURIComponent(recordId)}`;
        const authHeaders = token ? { "Authorization": `Bearer ${token}` } : {};
        let res = await fetch(endpoint, { headers: authHeaders });
        let data = await parseApiResponse(res);
        if (!res.ok && token && (res.status === 401 || res.status === 403)) {
          res = await fetch(endpoint);
          data = await parseApiResponse(res);
        }
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = "/web/login";
            return;
          }
          if (res.status === 403) {
            redirectToApprovalTable();
            return;
          }
          throw new Error(data.detail || "Unable to load customer details");
        }

        currentRecordId = String(data.recordId || recordId || "").trim();
        currentVendor = data.vendor || {};
        if (currentRecordId) {
          sessionStorage.setItem("customerLastViewedRecordId", currentRecordId);
        }
        sessionStorage.setItem("customerLastApprovalMode", getApprovalRedirectMode());
        const hodResolved = pickWithSource(
          currentVendor,
          ["rubaminApproverHod", "RubaminApproverHod", "hodEmail", "HodEmail"],
          ""
        );
        await loadHodOptions(token, hodResolved.value);
        renderMeta(currentVendor, currentRecordId);
        renderViewSections(currentVendor);
        applyValidatorValidationValues(currentVendor);
        applyHistoryModeUi(currentVendor);
        setMessage(
          isHistoryMode
            ? "Customer form loaded in history read-only mode."
            : "Customer form loaded in view mode.",
          "ok"
        );
        syncSubmitButtonState();
      } catch (err) {
        setMessage(err.message || "Unable to load customer details.", "err");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const pageHeading = document.getElementById("pageHeading");
      if (pageHeading) pageHeading.textContent = "View Customer Registration Form";
      document.title = "View Customer Form";
      const goBackBtn = document.getElementById("goBackBtn");
      if (goBackBtn) {
        goBackBtn.addEventListener("click", () => {
          redirectToApprovalTable();
        });
      }
      if (isHistoryMode) {
        applyHistoryModeUi({});
      }
      bindDecisionControls();
      bindGstFilingModalControls();
      loadVendorView();
    });
  </script>
</body>
