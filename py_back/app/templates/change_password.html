<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Change Password</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 24px; color: #1f2937; }
    .card { max-width: 460px; margin: 40px auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 8px 20px rgba(0,0,0,.08); }
    h1 { margin: 0 0 14px; font-size: 24px; color: #1e3a8a; }
    p { margin: 0 0 10px; color: #475569; font-size: 14px; }
    label { display: block; margin: 12px 0 6px; font-weight: 600; }
    input, button { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #d0d7e2; box-sizing: border-box; }
    button { background: #1d4ed8; color: #fff; border: none; margin-top: 16px; cursor: pointer; font-weight: 600; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 56px; }
    .password-wrap .toggle-pass { position: absolute; right: 8px; top: 50%; width: 38px; height: 34px; margin: 0; padding: 0; display: inline-flex; align-items: center; justify-content: center; transform: translateY(-50%) !important; background: transparent !important; color: #1f2937 !important; border: none !important; box-shadow: none !important; -webkit-backdrop-filter: none; backdrop-filter: none; line-height: 0; }
    .password-wrap .toggle-pass:hover:not(:disabled) { transform: translateY(-50%) !important; background: transparent !important; box-shadow: none !important; filter: none !important; }
    .password-wrap .toggle-pass:focus-visible { outline: 2px solid rgba(90, 169, 200, .5); outline-offset: 2px; }
    .password-wrap .toggle-pass svg { width: 18px; height: 18px; stroke-width: 2.2; }
    .msg { margin-top: 12px; font-size: 14px; min-height: 18px; }
    .ok { color: #0a7a2d; }
    .err { color: #b3261e; }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="card">
    <h1>Change Password</h1>
    <p>For security, you must change your password before accessing dashboard and vendor forms.</p>
    <form id="changePasswordForm">
      <label for="currentPassword">Current Password</label>
      <div class="password-wrap">
        <input id="currentPassword" type="password" required />
        <button id="toggleCurrentPasswordBtn" type="button" class="toggle-pass" aria-label="Show password" title="Show password"></button>
      </div>
      <label for="newPassword">New Password</label>
      <div class="password-wrap">
        <input id="newPassword" type="password" minlength="6" required />
        <button id="toggleNewPasswordBtn" type="button" class="toggle-pass" aria-label="Show password" title="Show password"></button>
      </div>
      <label for="confirmPassword">Confirm New Password</label>
      <div class="password-wrap">
        <input id="confirmPassword" type="password" minlength="6" required />
        <button id="toggleConfirmPasswordBtn" type="button" class="toggle-pass" aria-label="Show password" title="Show password"></button>
      </div>
      <button type="submit">Change Password</button>
    </form>
    <div id="message" class="msg"></div>
  </div>

  <script>
    const form = document.getElementById("changePasswordForm");
    const message = document.getElementById("message");
    const token = sessionStorage.getItem("token") || "";
    const queryParams = new URLSearchParams(window.location.search);
    const requestedNext = queryParams.get("next") || "/web/select-role";
    const redirectTarget = requestedNext.startsWith("/web/") ? requestedNext : "/web/select-role";
    const currentPasswordInput = document.getElementById("currentPassword");
    const newPasswordInput = document.getElementById("newPassword");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const toggleCurrentPasswordBtn = document.getElementById("toggleCurrentPasswordBtn");
    const toggleNewPasswordBtn = document.getElementById("toggleNewPasswordBtn");
    const toggleConfirmPasswordBtn = document.getElementById("toggleConfirmPasswordBtn");

    if (!token) {
      window.location.replace("/web/login");
    }

    async function parseApiResponse(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { detail: text };
      }
    }

    const passwordToggleIcons = {
      show: `<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2.1 12s3.7-7 9.9-7 9.9 7 9.9 7-3.7 7-9.9 7-9.9-7-9.9-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
      hide: `<svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 4.2A10.6 10.6 0 0 1 12 4.1c6.2 0 9.9 7 9.9 7a18 18 0 0 1-2.8 3.8"></path><path d="M14.1 14.1A3 3 0 0 1 9.9 9.9"></path><path d="M6.6 6.6C3.8 8.5 2.1 12 2.1 12s3.7 7 9.9 7a10.4 10.4 0 0 0 5.4-1.6"></path><path d="M2 2l20 20"></path></svg>`,
    };

    function setPasswordToggleState(buttonEl, isHidden) {
      const label = isHidden ? "Show password" : "Hide password";
      buttonEl.innerHTML = isHidden ? passwordToggleIcons.show : passwordToggleIcons.hide;
      buttonEl.setAttribute("aria-label", label);
      buttonEl.setAttribute("title", label);
    }

    function attachPasswordToggle(buttonEl, inputEl) {
      if (!buttonEl || !inputEl) return;
      setPasswordToggleState(buttonEl, inputEl.type === "password");
      buttonEl.addEventListener("click", () => {
        const isHidden = inputEl.type === "password";
        inputEl.type = isHidden ? "text" : "password";
        setPasswordToggleState(buttonEl, inputEl.type === "password");
      });
    }

    attachPasswordToggle(toggleCurrentPasswordBtn, currentPasswordInput);
    attachPasswordToggle(toggleNewPasswordBtn, newPasswordInput);
    attachPasswordToggle(toggleConfirmPasswordBtn, confirmPasswordInput);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const currentPassword = currentPasswordInput.value;
      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!currentPassword || !newPassword || !confirmPassword) {
        message.textContent = "Please fill all fields.";
        message.className = "msg err";
        return;
      }
      if (newPassword.length < 6) {
        message.textContent = "New password must be at least 6 characters.";
        message.className = "msg err";
        return;
      }
      if (newPassword !== confirmPassword) {
        message.textContent = "New password and confirm password do not match.";
        message.className = "msg err";
        return;
      }

      message.textContent = "Updating password...";
      message.className = "msg";

      try {
        const res = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ currentPassword, newPassword }),
        });
        const data = await parseApiResponse(res);
        if (!res.ok) {
          throw new Error(data.detail || "Unable to change password");
        }

        sessionStorage.setItem("token", data.token || token);
        sessionStorage.setItem("role", data.role || sessionStorage.getItem("role") || "");
        sessionStorage.setItem("email", data.email || sessionStorage.getItem("email") || "");
        sessionStorage.setItem("name", data.name || sessionStorage.getItem("name") || "");
        sessionStorage.setItem("passwordChangeRequired", "false");

        message.textContent = "Password changed successfully. Redirecting...";
        message.className = "msg ok";
        setTimeout(() => { window.location.href = redirectTarget; }, 600);
      } catch (err) {
        message.textContent = err.message || "Unable to change password";
        message.className = "msg err";
      }
    });
  </script>
</body>
</html>
