<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Update Customer Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 20px; color: #1f2937; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .page-header { background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 20px rgba(2, 6, 23, .08); margin-bottom: 12px; display: grid; grid-template-columns: 180px 1fr auto; gap: 14px; align-items: center; }
    .brand-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .brand-art { width: 160px; max-width: 100%; height: auto; display: block; }
    .brand-text { text-align: center; font-size: 20px; line-height: 1.4; color: #475569; font-weight: 700; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar button { width: auto; padding: 10px 14px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); margin-bottom: 12px; }
    .hidden { display: none !important; }
    h1 { margin-top: 0; font-size: 26px; color: #1e3a8a; }
    h2 { margin: 20px 0 10px; font-size: 18px; color: #1e3a8a; border-bottom: 1px solid #dbeafe; padding-bottom: 6px; }
    .subcard { background: #f8fbff; border: 1px solid #dbeafe; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .subcard h3 { margin: 0 0 12px; font-size: 16px; color: #1e3a8a; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .row { margin-bottom: 10px; }
    .full { grid-column: 1 / -1; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #334155; }
    input, textarea, select, button { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; }
    input, textarea, select { background: #fff; color: #1f2937; }
    textarea { min-height: 84px; resize: vertical; }
    button { background: #1d4ed8; color: #fff; border: none; font-weight: 700; cursor: pointer; }
    .btn-success { background: #0f766e; }
    .switch-row {
      border: 1px solid #ea580c;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fff;
      margin-top: 6px;
    }
    .switch-row span { font-size: 13px; font-weight: 700; color: #1f2937; }
    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #9ca3af;
      transition: .2s;
      border-radius: 999px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    .switch input:checked + .slider { background-color: #16a34a; }
    .switch input:checked + .slider:before { transform: translateX(24px); }
    .doc-preview {
      margin-top: 10px;
      border: 1px solid #dbe3f1;
      border-radius: 8px;
      padding: 10px;
      background: #fff;
    }
    .doc-preview.hidden { display: none; }
    .doc-preview iframe {
      width: 100%;
      min-height: 480px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .doc-preview img {
      max-width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
    }
    .doc-actions { margin-bottom: 10px; display: flex; justify-content: flex-end; }
    .doc-actions a { color: #1d4ed8; font-weight: 700; text-decoration: none; }
    .edit-meta-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    .edit-meta-row .meta { flex: 1 1 720px; margin-bottom: 0; }
    .edit-section-action-host {
      flex: 0 0 auto;
      display: flex;
      justify-content: flex-end;
      margin-left: auto;
    }
    .edit-section-action-host:empty { display: none; }
    .edit-section-action-host .dynamic-selector-edit-wrap { margin-bottom: 0; }
    .badge { background: #dbeafe; color: #1e40af; border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; }
    .msg { margin-top: 8px; font-size: 14px; }
    .msg.ok { color: #0a7a2d; }
    .msg.err { color: #b3261e; }
    .muted { color: #64748b; font-style: italic; }
    .locked-card {
      border-color: #f59e0b;
      background: #fff7ed;
    }
    .locked-note {
      margin: -2px 0 10px;
      color: #9a3412;
      font-size: 12px;
      font-weight: 700;
    }
    .req-star { color: #dc2626; margin-left: 4px; font-weight: 700; }
    .req-star.hidden { display: none; }
    .entry-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
    .entry-grid button { width: auto; min-width: 180px; }
    .row.lookup-spinner-host { position: relative; }
    .lookup-with-spinner { padding-right: 34px; }
    .lookup-spinner {
      position: absolute;
      right: 10px;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border: 2px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: lookupSpin .7s linear infinite;
      display: none;
      pointer-events: none;
    }
    .lookup-spinner.active { display: block; }
    @keyframes lookupSpin { to { transform: rotate(360deg); } }

    @media (max-width: 980px) {
      .page-header { grid-template-columns: 1fr; text-align: center; }
      .brand-left { align-items: center; }
      .grid { grid-template-columns: 1fr; }
      .entry-grid { grid-template-columns: 1fr; }
      .entry-grid button { width: 100%; }
      .edit-section-action-host { flex: 1 1 100%; }
    }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div class="brand-left">
        <img src="/web/header-art-image" alt="Header Art" class="brand-art" />
      </div>
      <div class="brand-text">Sharp & Tannan Chartered Accountants</div>
      <div></div>
    </div>

    <div class="toolbar">
      <button id="goBackBtn" type="button">Go Back</button>
      <button type="button" onclick="logoutAndRedirect()">Logout</button>
    </div>

    <div class="card">
      <h1 id="entryHeading">Update Customer Form</h1>
      <form id="entryForm">
        <div class="entry-grid">
          <div class="row">
            <label id="recordIdLabel" for="recordIdInput">Entry Page - Record ID</label>
            <input id="recordIdInput" type="text" placeholder="Enter Record ID" required />
          </div>
          <div class="row">
            <button id="loadEntryBtn" type="submit">Load Customer Form</button>
          </div>
        </div>
      </form>
      <div id="entryMessage" class="msg"></div>
    </div>

    <div id="editCard" class="card hidden">
      <h1 id="editHeading">Editable Customer Registration Form</h1>
      <div class="edit-meta-row">
        <div id="metaBadges" class="meta"></div>
        <div id="editSectionActionHost" class="edit-section-action-host"></div>
      </div>
      <form id="updateForm">
        <div id="sectionHost"></div>
        <div class="row full">
          <label for="updateRemarksInput">Update Remarks</label>
          <textarea
            id="updateRemarksInput"
            data-field-name="updateRemarks"
            data-source-key="updateRemarks"
            placeholder="Enter remarks for this update"
          ></textarea>
        </div>
        <div class="row full">
          <button id="updateBtn" type="submit" class="btn-success">Update Customer Record</button>
        </div>
      </form>
      <div id="updateMessage" class="msg"></div>
    </div>
  </div>

  <script>
    async function logoutAndRedirect() {
      await fetch("/api/auth/logout", { method: "POST" });
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");
      sessionStorage.removeItem("name");
      window.location.href = "/web/login";
    }

    async function parseApiResponse(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { detail: text };
      }
    }

    function createToastManager() {
      const host = document.createElement("div");
      host.style.position = "fixed";
      host.style.top = "20px";
      host.style.right = "20px";
      host.style.zIndex = "5000";
      document.body.appendChild(host);

      let activeToast = null;
      let activeTimer = null;

      function removeToast(toast) {
        if (!toast) return;
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 200);
        if (activeToast === toast) {
          activeToast = null;
        }
      }

      return function showToast(text, kind = "info", duration = 10000) {
        if (!text) return;
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        if (activeToast) {
          activeToast.remove();
          activeToast = null;
        }

        const colors = {
          ok: "#166534",
          err: "#b91c1c",
          info: "#1d4ed8",
        };

        const toast = document.createElement("div");
        toast.textContent = text;
        toast.style.minWidth = "280px";
        toast.style.maxWidth = "420px";
        toast.style.padding = "14px 16px";
        toast.style.borderRadius = "12px";
        toast.style.boxShadow = "0 12px 32px rgba(15, 23, 42, 0.24)";
        toast.style.background = colors[kind] || colors.info;
        toast.style.color = "#fff";
        toast.style.fontSize = "14px";
        toast.style.fontWeight = "700";
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        toast.style.transition = "opacity .2s ease, transform .2s ease";

        host.appendChild(toast);
        requestAnimationFrame(() => {
          toast.style.opacity = "1";
          toast.style.transform = "translateY(0)";
        });

        activeToast = toast;
        if (duration > 0) {
          activeTimer = setTimeout(() => removeToast(toast), duration);
        }
      };
    }

    const showToast = createToastManager();
    const isCustomerPortal = true;
    const recordTypeLabel = "Customer";
    const pageParams = new URLSearchParams(window.location.search);
    const requestedUpdateMode = String(pageParams.get("mode") || "").trim().toLowerCase();
    const isShipToOnlyMode = ["shipto", "ship-to", "ship_to"].includes(requestedUpdateMode);
    const initialRecordIdFromQuery = String(pageParams.get("recordId") || "").trim();
    const SHIP_TO_ONLY_FIELD_NAMES = new Set([
      "shipto",
      "state1",
      "district1",
      "pincode1",
      "lane4",
      "lane5",
      "lane6",
      "state2",
      "statename1",
      "district2",
      "pincode2",
      "lane7",
      "lane8",
      "lane9",
    ]);

    function isShipToEditableField(fieldName) {
      return SHIP_TO_ONLY_FIELD_NAMES.has(String(fieldName || "").trim().toLowerCase());
    }

    function getRecordApiBase() {
      return "/api/customer";
    }

    function getDashboardUrl() {
      return "/web/customer-dashboard";
    }

    function getBackUrl() {
      return isShipToOnlyMode ? "/web/customer-shipto" : getDashboardUrl();
    }

    function buildAuthHeaders() {
      const token = sessionStorage.getItem("token");
      return token ? { "Authorization": `Bearer ${token}` } : {};
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function isMeaningfulValue(value) {
      if (value === null || value === undefined) return false;
      if (typeof value === "string" && value.trim() === "") return false;
      return true;
    }

    function formatValue(value) {
      if (value === null || value === undefined) return "";
      if (typeof value === "boolean") return value ? "Yes" : "No";
      return String(value);
    }

    function toBool(value) {
      if (typeof value === "boolean") return value;
      if (typeof value === "number") return value !== 0;
      const normalized = String(value || "").trim().toLowerCase();
      return ["1", "true", "yes", "y", "on"].includes(normalized);
    }

    const IFSC_REGEX = /^[A-Z]{4}0[A-Z0-9]{6}$/;

    function pickValueWithSource(record, keys, fallbackKey) {
      for (const key of keys) {
        if (!Object.prototype.hasOwnProperty.call(record, key)) continue;
        const value = record[key];
        if (isMeaningfulValue(value)) {
          return { value, sourceKey: key };
        }
      }
      for (const key of keys) {
        if (Object.prototype.hasOwnProperty.call(record, key)) {
          return { value: record[key], sourceKey: key };
        }
      }
      return { value: "", sourceKey: fallbackKey || keys[0] || "" };
    }

    function toDocumentUrl(rawValue) {
      const value = String(rawValue || "").trim();
      if (!value) return "";
      if (value.startsWith("http://") || value.startsWith("https://") || value.startsWith("/")) {
        return value;
      }
      return `/mock-files/${encodeURIComponent(value)}`;
    }

    function fileNameFromUrl(url) {
      const clean = String(url || "").split("?")[0];
      if (!clean) return "";
      const parts = clean.split("/");
      return decodeURIComponent(parts[parts.length - 1] || "");
    }

    function buildRecordDocumentUrl(recordId, fieldName, rawValue) {
      const resolvedRecordId = String(recordId || currentRecordId || "").trim();
      const resolvedFieldName = String(fieldName || "").trim();
      if (resolvedRecordId && resolvedFieldName) {
        return `${getRecordApiBase()}/document?recordId=${encodeURIComponent(resolvedRecordId)}&fieldName=${encodeURIComponent(resolvedFieldName)}`;
      }
      return toDocumentUrl(rawValue);
    }

    function renderDocumentPreview(previewEl, docUrl, docName = "") {
      const lower = String(docName || docUrl).toLowerCase().split("?")[0];
      let bodyHtml = `<div class="doc-actions"><a href="${escapeHtml(docUrl)}" target="_blank" rel="noopener noreferrer">Open In New Page</a></div>`;

      if (lower.endsWith(".pdf")) {
        bodyHtml += `<iframe src="${escapeHtml(docUrl)}" title="Document Preview"></iframe>`;
      } else if (/\.(png|jpg|jpeg|gif|webp|bmp|svg)$/.test(lower)) {
        bodyHtml += `<img src="${escapeHtml(docUrl)}" alt="Uploaded Document Preview" />`;
      } else {
        bodyHtml += `<div class="muted">Inline preview is not available for this file type.</div>`;
      }

      previewEl.innerHTML = bodyHtml;
      previewEl.classList.remove("hidden");
    }

    const COMPANY_OPTIONS = [
      "Sharp & Tannan Chartered Accountants",
    ];
    const VENDOR_CATEGORY_OPTIONS = [
      "Manufacturer",
      "Distributer",
      "Dealer",
      "Trader",
      "Transporter",
      "Service Provider",
    ];
    const GST_OPTIONS = [
      { value: "Registered", label: "Yes (Registered)" },
      { value: "Not Registered", label: "No (Not Registered)" },
    ];
    const YES_NO_OPTIONS = [
      { value: "Yes", label: "Yes" },
      { value: "No", label: "No" },
    ];
    const MSME_CATEGORY_OPTIONS = [
      "Small",
      "Micro",
      "Medium",
      "Not an MSME",
    ];
    const MSME_INDUSTRY_OPTIONS = [
      "Manufacturing",
      "Service",
      "Trading",
    ];
    const ISO_OPTIONS = ["9000", "14000", "18000", "22000", "Other"];
    const BOOLEAN_OPTIONS = [
      { value: "true", label: "Yes" },
      { value: "false", label: "No" },
    ];
    const COUNTRY_OPTIONS = ["India", "United States", "Switzerland", "Other / Not Listed"];
    const INDIAN_STATE_OPTIONS = [
      "Andhra Pradesh","Arunachal Pradesh","Assam","Bihar","Chhattisgarh","Goa","Gujarat","Haryana","Himachal Pradesh","Jharkhand","Karnataka","Kerala","Madhya Pradesh","Maharashtra","Manipur","Meghalaya","Mizoram","Nagaland","Odisha","Punjab","Rajasthan","Sikkim","Tamil Nadu","Telangana","Tripura","Uttar Pradesh","Uttarakhand","West Bengal","Andaman and Nicobar Islands","Chandigarh","Dadra and Nagar Haveli and Daman and Diu","Delhi","Jammu and Kashmir","Ladakh","Lakshadweep","Puducherry",
    ];
    const US_STATE_OPTIONS = [
      "Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa","Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey","New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont","Virginia","Washington","West Virginia","Wisconsin","Wyoming",
    ];
    const SWITZERLAND_STATE_OPTIONS = [
      "Aargau","Appenzell Ausserrhoden","Appenzell Innerrhoden","Basel-Landschaft","Basel-Stadt","Bern","Fribourg","Geneva","Glarus","Graubunden","Jura","Lucerne","Neuchatel","Nidwalden","Obwalden","Schaffhausen","Schwyz","Solothurn","St. Gallen","Thurgau","Ticino","Uri","Valais","Vaud","Zug","Zurich",
    ];
    const DEFAULT_STATE_OPTIONS = ["Other / Not Listed"];
    const ISO_DOCUMENT_FIELD_TO_VALUE = {
      iso1: "9000",
      iso2: "14000",
      iso3: "18000",
      iso4: "22000",
      iso5: "Other",
    };

    function parseIsoCertificateValues(rawValue) {
      if (Array.isArray(rawValue)) {
        return rawValue.map((value) => String(value || "").trim()).filter(Boolean);
      }
      const text = String(rawValue ?? "").trim();
      if (!text) {
        return [];
      }
      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) {
          return parsed.map((value) => String(value || "").trim()).filter(Boolean);
        }
      } catch (_) {
      }
      return text.split(",").map((value) => value.trim()).filter(Boolean);
    }

    function normalizeSelectValue(fieldName, rawValue) {
      const value = formatValue(rawValue).trim();
      if (!value) return "";

      if (fieldName === "isoCertificates") {
        if (value.startsWith("[") && value.endsWith("]")) {
          try {
            const parsed = JSON.parse(value);
            if (Array.isArray(parsed) && parsed.length) {
              return String(parsed[0] || "").trim();
            }
          } catch (_) {
          }
        }
        return value;
      }

      if (fieldName === "bankPaymentMethod" || fieldName === "agreeCodeOfConduct" || fieldName === "agreeInformationAccuracy") {
        const lowered = value.toLowerCase();
        if (["true", "yes", "1", "y"].includes(lowered)) return "true";
        if (["false", "no", "0", "n"].includes(lowered)) return "false";
      }

      return value;
    }

    function normalizeOptions(optionValues) {
      return optionValues.map((entry) => {
        if (typeof entry === "string") {
          return { value: entry, label: entry };
        }
        return { value: String(entry.value || ""), label: String(entry.label || entry.value || "") };
      });
    }

    function withSelectedOption(options, selectedValue) {
      if (!selectedValue) return options;
      if (options.some((item) => String(item.value) === String(selectedValue))) return options;
      return [{ value: selectedValue, label: selectedValue }, ...options];
    }

    function getStateOptionsByCountry(countryValue) {
      const country = String(countryValue || "").trim();
      if (country === "India") return normalizeOptions(INDIAN_STATE_OPTIONS);
      if (country === "United States") return normalizeOptions(US_STATE_OPTIONS);
      if (country === "Switzerland") return normalizeOptions(SWITZERLAND_STATE_OPTIONS);
      return normalizeOptions(DEFAULT_STATE_OPTIONS);
    }

    function getFieldOptions(fieldName, vendor) {
      if (fieldName === "companyName") return normalizeOptions(COMPANY_OPTIONS);
      if (fieldName === "vendorCategory") return normalizeOptions(VENDOR_CATEGORY_OPTIONS);
      if (fieldName === "gstRegistrationStatus") return normalizeOptions(GST_OPTIONS);
      if (fieldName === "company") return normalizeOptions(YES_NO_OPTIONS);
      if (fieldName === "panStatus") return normalizeOptions(YES_NO_OPTIONS);
      if (fieldName === "msmeStatus") return normalizeOptions(YES_NO_OPTIONS);
      if (fieldName === "pfStatus") return normalizeOptions(YES_NO_OPTIONS);
      if (fieldName === "esiStatus") return normalizeOptions(YES_NO_OPTIONS);
      if (fieldName === "msmeCategory") return normalizeOptions(MSME_CATEGORY_OPTIONS);
      if (fieldName === "msmeIndustry") return normalizeOptions(MSME_INDUSTRY_OPTIONS);
      if (fieldName === "country") return normalizeOptions(COUNTRY_OPTIONS);
      if (fieldName === "state") {
        const countryValue = pickValueWithSource(vendor, ["country", "Country"], "country").value;
        return getStateOptionsByCountry(countryValue);
      }
      if (fieldName === "isoCertificates") return normalizeOptions(ISO_OPTIONS);
      if (fieldName === "bankPaymentMethod") return normalizeOptions(BOOLEAN_OPTIONS);
      if (fieldName === "agreeCodeOfConduct") return normalizeOptions(BOOLEAN_OPTIONS);
      if (fieldName === "agreeInformationAccuracy") return normalizeOptions(BOOLEAN_OPTIONS);
      return [];
    }

    function selectFieldHtml(field, value, sourceKey, vendor, locked = false) {
      if (field.name === "isoCertificates") {
        const selectedValues = parseIsoCertificateValues(value);
        const selectedSet = new Set(selectedValues);
        let options = getFieldOptions(field.name, vendor);
        selectedValues.forEach((selectedValue) => {
          options = withSelectedOption(options, selectedValue);
        });
        const lockedAttr = locked ? ' disabled data-locked-field="true"' : "";
        const optionsHtml = options.map((item) => {
          const optionValue = String(item.value || "");
          const isSelected = selectedSet.has(optionValue) ? " selected" : "";
          return `<option value="${escapeHtml(optionValue)}"${isSelected}>${escapeHtml(item.label)}</option>`;
        }).join("");

        return `
          <div class="row">
            <label>${escapeHtml(field.label)}</label>
            <select multiple size="5" data-iso-certificates-select data-field-name="${escapeHtml(field.name)}" data-source-key="${escapeHtml(sourceKey)}"${lockedAttr}>
              ${optionsHtml}
            </select>
          </div>
        `;
      }

      const selectedValue = normalizeSelectValue(field.name, value);
      let options = getFieldOptions(field.name, vendor);
      options = withSelectedOption(options, selectedValue);
      const lockedAttr = locked ? ' disabled data-locked-field="true"' : "";

      let roleAttr = "";
      if (field.name === "country") roleAttr = ' data-select-role="country"';
      if (field.name === "state") roleAttr = ' data-select-role="state"';

      const optionsHtml = [`<option value="">Select</option>`]
        .concat(
          options.map((item) => {
            const optionValue = String(item.value || "");
            const isSelected = optionValue === selectedValue ? " selected" : "";
            return `<option value="${escapeHtml(optionValue)}"${isSelected}>${escapeHtml(item.label)}</option>`;
          })
        )
        .join("");

      return `
        <div class="row">
          <label>${escapeHtml(field.label)}</label>

        const optionsHtml = [`<option value="">Select</option>`]

    function normalizeIfscCode(value) {
      return String(value || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 11);
    }

    function bindIfscAutoFill() {
      const ifscFields = getFieldElementsByName("ifscCode");
      if (!ifscFields.length) {
        return;
      }
      const bankFields = getFieldElementsByName("bankName");
      const branchFields = getFieldElementsByName("branchName");

      ifscFields.forEach((ifscField, index) => {
        if (!ifscField || ifscField.dataset.lockedField === "true") {
          return;
        }
        const bankField = bankFields[index] || bankFields[0];
        const branchField = branchFields[index] || branchFields[0];
        if (!bankField || !branchField) {
          return;
        }

        const spinnerHost = ifscField.closest(".row");
        if (spinnerHost) {
          spinnerHost.classList.add("lookup-spinner-host");
        }
        ifscField.classList.add("lookup-with-spinner");
        const spinnerEl = document.createElement("span");
        spinnerEl.className = "lookup-spinner";
        if (spinnerHost) {
          spinnerHost.appendChild(spinnerEl);
        }
        const setSpinner = (loading) => {
          spinnerEl.classList.toggle("active", !!loading);
        };

        let lookupCounter = 0;
        let lastLookupValue = "";
        const triggerLookup = async () => {
          const normalized = normalizeIfscCode(ifscField.value);
          if (ifscField.value !== normalized) {
            ifscField.value = normalized;
          }
          if (!IFSC_REGEX.test(normalized)) {
            lastLookupValue = "";
            setSpinner(false);
            return;
          }
          if (normalized === lastLookupValue) {
            setSpinner(false);
            return;
          }

          const requestId = ++lookupCounter;
          setSpinner(true);
          try {
            const res = await fetch(`/api/ifsc/${encodeURIComponent(normalized)}`);
            const data = await parseApiResponse(res);
            if (requestId !== lookupCounter || !res.ok) {
              return;
            }

            const nextBankName = String(data?.bankName || data?.bank || "").trim();
            const nextBranchName = String(data?.branchName || data?.branch || "").trim();
            if (nextBankName) {
              bankField.value = nextBankName;
            }
            if (nextBranchName) {
              branchField.value = nextBranchName;
            }
            lastLookupValue = normalized;
            refreshRequiredStars();
          } catch (_) {
          } finally {
            if (requestId === lookupCounter) {
              setSpinner(false);
            }
          }
        };

        ifscField.addEventListener("input", triggerLookup);
        ifscField.addEventListener("change", triggerLookup);
        ifscField.addEventListener("blur", triggerLookup);
      });
    }

    function bindDocumentControls() {
      const toggles = document.querySelectorAll("[data-doc-toggle]");
      toggles.forEach((toggle) => {
        const inputId = String(toggle.dataset.inputId || "");
        const previewId = String(toggle.dataset.previewId || "");
        const inputEl = document.getElementById(inputId);
        const previewEl = document.getElementById(previewId);
        if (!inputEl || !previewEl) return;
        const reuploadEl = document.querySelector(`[data-doc-reupload][data-doc-input-id="${inputId}"]`);
        const reuploadFileId = String(reuploadEl?.dataset.docFileId || "");
        const reuploadFileWrapId = String(reuploadEl?.dataset.docFileWrapId || "");
        const reuploadFileEl = reuploadFileId ? document.getElementById(reuploadFileId) : null;
        const reuploadFileWrapEl = reuploadFileWrapId ? document.getElementById(reuploadFileWrapId) : null;

        const hidePreview = () => {
          toggle.checked = false;
          previewEl.classList.add("hidden");
          previewEl.innerHTML = "";
        };

        const getReuploadMode = () => String(reuploadEl?.value || "No").trim().toLowerCase();

        const syncToggleAvailability = () => {
          const fieldName = String(toggle.dataset.docFieldName || inputEl.dataset.fieldName || "").trim();
          const hasValue = String(inputEl.value || "").trim() !== "" || (String(currentRecordId || "").trim() !== "" && fieldName !== "");
          const isReupload = getReuploadMode() === "yes";
          toggle.disabled = isReupload || !hasValue;
          if (toggle.disabled) {
            hidePreview();
          }
        };

        const renderIfEnabled = () => {
          if (!toggle.checked) return;
          const fieldName = String(toggle.dataset.docFieldName || inputEl.dataset.fieldName || "").trim();
          const docUrl = buildRecordDocumentUrl(currentRecordId, fieldName, inputEl.value);
          const docName = String(inputEl.value || toggle.dataset.docName || "").trim();
          if (!docUrl) {
            previewEl.classList.remove("hidden");
            previewEl.innerHTML = `<div class="muted">Document not available.</div>`;
            return;
          }
          renderDocumentPreview(previewEl, docUrl, docName);
        };

        const applyReuploadVisibility = () => {
          const isReupload = getReuploadMode() === "yes";
          if (reuploadFileWrapEl) {
            reuploadFileWrapEl.classList.toggle("hidden", !isReupload);
          }
          if (isReupload) {
            inputEl.value = "";
          } else {
            if (reuploadFileEl) {
              reuploadFileEl.value = "";
            }
            inputEl.value = String(inputEl.dataset.originalValue || "");
          }
          syncToggleAvailability();
          refreshRequiredStars();
        };

        toggle.addEventListener("change", () => {
          if (!toggle.checked) {
            previewEl.classList.add("hidden");
            previewEl.innerHTML = "";
            return;
          }
          renderIfEnabled();
        });

        inputEl.addEventListener("input", () => {
          syncToggleAvailability();
          renderIfEnabled();
        });

        if (reuploadEl) {
          reuploadEl.addEventListener("change", applyReuploadVisibility);
        }

        if (reuploadFileEl) {
          reuploadFileEl.addEventListener("change", () => {
            const fileObj = reuploadFileEl.files && reuploadFileEl.files[0];
            if (fileObj) {
              inputEl.value = String(fileObj.name || "").trim();
            } else if (getReuploadMode() === "yes") {
              inputEl.value = "";
            }
            syncToggleAvailability();
            hidePreview();
            refreshRequiredStars();
          });
        }

        if (reuploadEl) {
          applyReuploadVisibility();
        }
        syncToggleAvailability();
      });
    }

    function getFieldElementsByName(fieldName) {
      return Array.from(document.querySelectorAll(`[data-field-name="${fieldName}"]`));
    }

    function getFirstFieldValue(fieldName) {
      const first = getFieldElementsByName(fieldName)[0];
      if (!first) return "";
      return String(first.value || "").trim();
    }

    function isPositiveValue(value, positiveValues) {
      const normalized = String(value || "").trim().toLowerCase();
      return positiveValues.some((item) => normalized === String(item || "").trim().toLowerCase());
    }

    function setRequiredStateForField(fieldName, required) {
      const fields = getFieldElementsByName(fieldName);
      fields.forEach((field) => {
        if (field.dataset.lockedField === "true") {
          field.removeAttribute("required");
          delete field.dataset.conditionalRequired;
          return;
        }
        if (required) {
          field.setAttribute("required", "required");
          field.dataset.conditionalRequired = "true";
        } else if (field.dataset.conditionalRequired === "true") {
          field.removeAttribute("required");
          delete field.dataset.conditionalRequired;
        }
      });
    }

    function isFieldEmpty(field) {
      if (!field) return true;
      return String(field.value || "").trim() === "";
    }

    function refreshRequiredStars() {
      const fields = document.querySelectorAll("[data-field-name]");
      fields.forEach((field) => {
        const row = field.closest(".row");
        const label = row ? row.querySelector("label") : null;
        if (!label) return;

        let star = label.querySelector(".req-star");
        if (!star) {
          star = document.createElement("span");
          star.className = "req-star";
          star.textContent = "*";
          label.appendChild(star);
        }

        const locked = field.dataset.lockedField === "true";
        const required = field.hasAttribute("required");
        const shouldShow = !locked && required && isFieldEmpty(field);
        star.classList.toggle("hidden", !shouldShow);
      });
    }

    function applyConditionalRequiredRules() {
      const impactedFields = new Set();
      CONDITIONAL_REQUIRED_RULES.forEach((rule) => {
        rule.requiredFields.forEach((name) => impactedFields.add(name));
      });
      impactedFields.forEach((fieldName) => setRequiredStateForField(fieldName, false));

      CONDITIONAL_REQUIRED_RULES.forEach((rule) => {
        const triggerValue = getFirstFieldValue(rule.triggerField);
        if (!isPositiveValue(triggerValue, rule.positiveValues)) {
          return;
        }
        rule.requiredFields.forEach((fieldName) => setRequiredStateForField(fieldName, true));
      });

      refreshRequiredStars();
    }

    function bindConditionalRequiredRules() {
      CONDITIONAL_REQUIRED_RULES.forEach((rule) => {
        const triggerFields = getFieldElementsByName(rule.triggerField);
        triggerFields.forEach((field) => {
          field.addEventListener("change", applyConditionalRequiredRules);
          field.addEventListener("input", applyConditionalRequiredRules);
        });
      });

      const allFields = document.querySelectorAll("[data-field-name]");
      allFields.forEach((field) => {
        field.addEventListener("input", refreshRequiredStars);
        field.addEventListener("change", refreshRequiredStars);
      });

      applyConditionalRequiredRules();
    }

    function normalizeSectionTitle(value) {
      return String(value || "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function parseSelectedSectionTitles(rawValue) {
      const values = [];
      const addValue = (value) => {
        const text = String(value || "").trim();
        if (text) values.push(text);
      };

      if (Array.isArray(rawValue)) {
        rawValue.forEach((item) => addValue(item));
      } else {
        const rawText = String(rawValue ?? "").trim();
        if (rawText) {
          let parsed = null;
          try {
            parsed = JSON.parse(rawText);
          } catch (_) {
            parsed = null;
          }
          if (Array.isArray(parsed)) {
            parsed.forEach((item) => addValue(item));
          } else {
            rawText.split(/[,\n|]+/).forEach((item) => addValue(item));
          }
        }
      }

      return Array.from(new Set(values));
    }

    function titleMatchesSelectedSection(title, normalizedSelectedTitles) {
      const normalizedTitle = normalizeSectionTitle(title);
      if (!normalizedTitle || !normalizedSelectedTitles.length) return false;
      return normalizedSelectedTitles.some((selectedTitle) => (
        selectedTitle === normalizedTitle
        || selectedTitle.includes(normalizedTitle)
        || normalizedTitle.includes(selectedTitle)
      ));
    }

    function initUpdateSectionSelection(formEl, vendor) {
      const editActionHost = document.getElementById("editSectionActionHost");
      if (editActionHost) editActionHost.innerHTML = "";
      if (!formEl || isShipToOnlyMode) return;
      const sectionHost = document.getElementById("sectionHost");
      if (!sectionHost) return;

      formEl.querySelectorAll(".dynamic-selector-card").forEach((node) => node.remove());
      formEl.querySelectorAll(".dynamic-selector-edit-wrap").forEach((node) => node.remove());
      formEl.querySelectorAll("[data-dynamic-selected-sections='1']").forEach((node) => node.remove());
      ensureDynamicSectionSelectionStyle();

      const selectedSectionsSource = pickValueWithSource(
        vendor || {},
        ["selectedSections", "SelectedSections", "selected_sections", "selectedSection", "SelectedSection"],
        "selectedSections"
      );
      const selectedTitles = parseSelectedSectionTitles(selectedSectionsSource.value);
      const normalizedSelectedTitles = selectedTitles.map((item) => normalizeSectionTitle(item)).filter(Boolean);
      const selectedSectionsSourceKey = String(selectedSectionsSource.sourceKey || "selectedSections").trim() || "selectedSections";

      const groups = [];
      const headingNodes = new Set();
      const alwaysVisibleGroupIds = new Set();
      const isAlwaysVisibleGroup = (title) => /declaration/i.test(String(title || ""));
      let currentHeading = null;
      let sectionCounter = 0;

      const isEligibleControl = (control) => {
        const tag = String(control.tagName || "").toLowerCase();
        if (!["input", "select", "textarea"].includes(tag)) return false;
        const type = String(control.type || "").toLowerCase();
        if (["hidden", "button", "submit", "reset", "image"].includes(type)) return false;
        return true;
      };

      Array.from(sectionHost.children).forEach((node) => {
        if (node.tagName === "H2") {
          currentHeading = node;
          return;
        }
        if (!node.classList || !node.classList.contains("subcard")) return;
        const controls = Array.from(node.querySelectorAll("input, select, textarea")).filter(isEligibleControl);
        if (!controls.length) return;
        sectionCounter += 1;
        const titleEl = node.querySelector("h3");
        const title = (titleEl ? String(titleEl.textContent || "") : "").trim() || `Section ${sectionCounter}`;
        const groupId = `sec_${sectionCounter}`;
        if (currentHeading) {
          headingNodes.add(currentHeading);
        }
        if (isAlwaysVisibleGroup(title)) {
          alwaysVisibleGroupIds.add(groupId);
        }
        groups.push({
          id: groupId,
          title,
          nodes: [node],
          controls,
          heading: currentHeading,
        });
      });

      if (!groups.length) return;

      const hiddenSelectedInput = document.createElement("input");
      hiddenSelectedInput.type = "hidden";
      hiddenSelectedInput.dataset.dynamicSelectedSections = "1";
      hiddenSelectedInput.dataset.fieldName = "selectedSections";
      hiddenSelectedInput.dataset.sourceKey = selectedSectionsSourceKey;
      hiddenSelectedInput.value = "";
      formEl.prepend(hiddenSelectedInput);

      const selectorCard = document.createElement("div");
      selectorCard.className = "subcard dynamic-selector-card";
      selectorCard.innerHTML = `
        <div class="dynamic-selector-header">
          <div>
            <h3 class="dynamic-selector-title">Select Form Sections</h3>
            <p class="dynamic-selector-subtitle">Choose the form sections to update. Existing section selection is prefilled; you can add more before continuing.</p>
          </div>
          <div class="dynamic-selector-pill">Step 1 of 2</div>
        </div>
        <div class="dynamic-selector-grid" role="group" aria-label="Form section selection"></div>
        <div class="dynamic-selector-toolbar">
          <div class="dynamic-selector-count" id="dynamicSelectorCount">0 sections selected</div>
          <div class="dynamic-selector-note">Declaration stays compulsory for every form.</div>
        </div>
        <div class="dynamic-selector-actions">
          <div class="dynamic-selector-message" id="dynamicSelectorMessage"></div>
          <button type="button" id="dynamicSelectorSaveNext">Save & Next</button>
        </div>
      `;
      formEl.insertBefore(selectorCard, sectionHost);
      const editSelectionWrap = document.createElement("div");
      editSelectionWrap.className = "dynamic-selector-edit-wrap hidden";
      editSelectionWrap.innerHTML = `<button type="button" class="dynamic-selector-edit-btn">Edit Section Selection</button>`;
      if (editActionHost) {
        editActionHost.appendChild(editSelectionWrap);
      } else {
        formEl.insertBefore(editSelectionWrap, sectionHost);
      }

      const listEl = selectorCard.querySelector(".dynamic-selector-grid");
      const messageEl = selectorCard.querySelector("#dynamicSelectorMessage");
      const saveNextBtn = selectorCard.querySelector("#dynamicSelectorSaveNext");
      const countEl = selectorCard.querySelector("#dynamicSelectorCount");
      const editSelectionBtn = editSelectionWrap.querySelector(".dynamic-selector-edit-btn");

      groups
        .filter((group) => !alwaysVisibleGroupIds.has(group.id))
        .forEach((group) => {
          const item = document.createElement("label");
          item.className = "dynamic-selector-item";
          item.innerHTML = `<input type="checkbox" value="${group.id}" data-group-title="${escapeHtml(group.title)}" /> <span class="dynamic-selector-item-title">${escapeHtml(group.title)}</span>`;
          listEl.appendChild(item);
        });

      const checkboxEls = Array.from(listEl.querySelectorAll("input[type='checkbox']"));
      checkboxEls.forEach((checkbox) => {
        const groupTitle = String(checkbox.getAttribute("data-group-title") || "").trim();
        checkbox.checked = normalizedSelectedTitles.length
          ? titleMatchesSelectedSection(groupTitle, normalizedSelectedTitles)
          : true;
      });
      if (checkboxEls.length && !checkboxEls.some((checkbox) => checkbox.checked)) {
        checkboxEls.forEach((checkbox) => {
          checkbox.checked = true;
        });
      }

      const setControlState = (control, visible) => {
        if (!control.dataset.dynamicPrevDisabled) {
          control.dataset.dynamicPrevDisabled = control.disabled ? "1" : "0";
        }
        if (!control.dataset.dynamicPrevRequired) {
          control.dataset.dynamicPrevRequired = control.required ? "1" : "0";
        }

        if (!visible) {
          control.required = false;
          control.disabled = true;
          return;
        }

        control.disabled = control.dataset.dynamicPrevDisabled === "1";
        if (control.disabled || control.readOnly) {
          control.required = false;
          return;
        }
        control.required = control.dataset.dynamicPrevRequired === "1";
      };

      const applyVisibility = (selectedIds) => {
        groups.forEach((group) => {
          const visible = alwaysVisibleGroupIds.has(group.id) || selectedIds.has(group.id);
          group.nodes.forEach((node) => node.classList.toggle("dynamic-selector-hidden", !visible));
          group.controls.forEach((control) => setControlState(control, visible));
        });

        headingNodes.forEach((heading) => heading.classList.add("dynamic-selector-hidden"));
        groups.forEach((group) => {
          if ((alwaysVisibleGroupIds.has(group.id) || selectedIds.has(group.id)) && group.heading) {
            group.heading.classList.remove("dynamic-selector-hidden");
          }
        });
      };

      const auxNodes = Array.from(formEl.children).filter((node) => (
        node !== sectionHost
        && node !== selectorCard
        && node !== editSelectionWrap
        && node !== hiddenSelectedInput
      ));

      const buildSelectedIds = () => new Set(
        Array.from(listEl.querySelectorAll("input[type='checkbox']:checked")).map((input) => input.value)
      );

      const selectedTitlesFromIds = (selectedIds) => groups
        .filter((group) => selectedIds.has(group.id))
        .map((group) => group.title);

      const updateSelectionSummary = () => {
        let selectedCount = 0;
        checkboxEls.forEach((checkbox) => {
          const selected = checkbox.checked;
          checkbox.closest(".dynamic-selector-item")?.classList.toggle("dynamic-selected", selected);
          if (selected) selectedCount += 1;
        });
        if (countEl) {
          countEl.textContent = `${selectedCount} section${selectedCount === 1 ? "" : "s"} selected`;
        }
        hiddenSelectedInput.value = JSON.stringify(selectedTitlesFromIds(buildSelectedIds()));
      };

      checkboxEls.forEach((checkbox) => checkbox.addEventListener("change", updateSelectionSummary));
      updateSelectionSummary();

      const openSelectionStep = () => {
        groups.forEach((group) => {
          group.nodes.forEach((node) => node.classList.add("dynamic-selector-hidden"));
          group.controls.forEach((control) => setControlState(control, false));
        });
        headingNodes.forEach((heading) => heading.classList.add("dynamic-selector-hidden"));
        auxNodes.forEach((node) => node.classList.add("dynamic-selector-hidden"));
        editSelectionWrap.classList.add("hidden");
        selectorCard.classList.remove("dynamic-selector-hidden");
      };

      const applySelectedSectionsAndContinue = (selectedIds) => {
        applyVisibility(selectedIds);
        hiddenSelectedInput.value = JSON.stringify(selectedTitlesFromIds(selectedIds));
        auxNodes.forEach((node) => node.classList.remove("dynamic-selector-hidden"));
        selectorCard.classList.add("dynamic-selector-hidden");
        editSelectionWrap.classList.remove("hidden");
        applyConditionalRequiredRules();
        refreshRequiredStars();
      };

      openSelectionStep();

      saveNextBtn.addEventListener("click", () => {
        const selectedIds = buildSelectedIds();
        if (!selectedIds.size) {
          if (messageEl) messageEl.textContent = "Select at least one section to continue.";
          return;
        }
        if (messageEl) messageEl.textContent = "";
        applySelectedSectionsAndContinue(selectedIds);
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      if (editSelectionBtn) {
        editSelectionBtn.addEventListener("click", () => {
          openSelectionStep();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    }

    function renderEditableSections(vendor) {
      const host = document.getElementById("sectionHost");
      host.innerHTML = "";
      let docCounter = 0;
      const lockedCards = getLockedCardTitles(vendor);
      const activeSectionConfig = isShipToOnlyMode
        ? sectionConfig
            .map((section) => {
              const visibleCards = section.cards
                .map((card) => {
                  const visibleFields = card.fields.filter((field) => isShipToEditableField(field.name));
                  if (!visibleFields.length) return null;
                  return {
                    title: card.title,
                    fields: visibleFields,
                  };
                })
                .filter(Boolean);
              if (!visibleCards.length) return null;
              return {
                title: section.title,
                cards: visibleCards,
              };
            })
            .filter(Boolean)
        : sectionConfig;

      activeSectionConfig.forEach((section) => {
        let sectionHtml = `<h2>${escapeHtml(section.title)}</h2>`;
        section.cards.forEach((card) => {
          const isCardLocked = lockedCards.has(card.title);
          let fieldsHtml = "";
          card.fields.forEach((field) => {
            const resolved = pickValueWithSource(vendor, field.keys, field.name);
            const isFieldLocked = isCardLocked || (isShipToOnlyMode && !isShipToEditableField(field.name));
            if (field.doc) {
              docCounter += 1;
              fieldsHtml += documentFieldHtml(field, resolved.value, resolved.sourceKey, docCounter, isFieldLocked);
            } else if (field.select) {
              fieldsHtml += selectFieldHtml(field, resolved.value, resolved.sourceKey, vendor, isFieldLocked);
            } else {
              fieldsHtml += textFieldHtml(field, resolved.value, resolved.sourceKey, isFieldLocked);
            }
          });
          const cardClass = isCardLocked ? "subcard locked-card" : "subcard";
          const lockNote = isCardLocked
            ? '<div class="locked-note">Locked because validator marked this section as validated.</div>'
            : "";
          sectionHtml += `
            <div class="${cardClass}">
              <h3>${escapeHtml(card.title)}</h3>
              ${lockNote}
              <div class="grid">${fieldsHtml}</div>
            </div>
          `;
        });
        host.innerHTML += sectionHtml;
      });

      bindCountryStateDropdown();
      bindConditionalRequiredRules();
      bindDocumentControls();
      bindIsoCertificateMultiSelect();
      bindIfscAutoFill();
      initUpdateSectionSelection(document.getElementById("updateForm"), vendor);
    }

    function bindUpdateRemarksField(vendor) {
      const remarksInput = document.getElementById("updateRemarksInput");
      if (!remarksInput) return;
      const resolved = pickValueWithSource(vendor || {}, ["updateRemarks", "UpdateRemarks"], "updateRemarks");
      remarksInput.value = formatValue(resolved.value);
      remarksInput.dataset.sourceKey = String(resolved.sourceKey || "updateRemarks").trim() || "updateRemarks";
      if (isShipToOnlyMode) {
        remarksInput.readOnly = true;
        remarksInput.dataset.lockedField = "true";
      } else {
        remarksInput.readOnly = false;
        delete remarksInput.dataset.lockedField;
      }
    }

    function collectUpdatePayload() {
      const fields = document.querySelectorAll("[data-field-name]");
      const updates = {};
      fields.forEach((fieldEl) => {
        if (Object.prototype.hasOwnProperty.call(fieldEl.dataset, "originalValue")) {
          return;
        }
        if (fieldEl.dataset.lockedField === "true") {
          return;
        }
        if (fieldEl.disabled) {
          return;
        }
        if (fieldEl.closest(".dynamic-selector-hidden")) {
          return;
        }
        const fieldName = String(fieldEl.dataset.fieldName || "").trim();
        const sourceKey = String(fieldEl.dataset.sourceKey || fieldName).trim();
        if (!fieldName || !sourceKey) return;
        let value = String(fieldEl.value || "").trim();
        if (fieldName === "isoCertificates") {
          const selectedValues = getSelectedIsoCertificatesFromSelect(fieldEl);
          value = selectedValues.length ? JSON.stringify(selectedValues) : "";
        }
        updates[sourceKey] = value;
        if (sourceKey.toLowerCase() !== fieldName.toLowerCase()) {
          updates[fieldName] = value;
        }
      });
      return updates;
    }

    async function loadVendorByRecordId(recordId) {
      setMessage("entryMessage", `Loading ${recordTypeLabel.toLowerCase()} details...`);
      setMessage("updateMessage", "");
      try {
        const res = await fetch(`${getRecordApiBase()}/record?recordId=${encodeURIComponent(recordId)}`, {
          headers: buildAuthHeaders(),
        });
        const data = await parseApiResponse(res);
        if (!res.ok) {
          throw new Error(data.detail || `Unable to load ${recordTypeLabel.toLowerCase()} details`);
        }

        currentRecordId = String(data.recordId || recordId || "").trim();
        currentVendor = data.vendor || {};
        renderMeta(currentVendor, currentRecordId);
        renderEditableSections(currentVendor);
        bindUpdateRemarksField(currentVendor);
        document.getElementById("editCard").classList.remove("hidden");
        setMessage("entryMessage", `${recordTypeLabel} form loaded for update.`, "ok");
      } catch (err) {
        setMessage("entryMessage", err.message || `Unable to load ${recordTypeLabel.toLowerCase()} details.`, "err");
      }
    }

    async function updateVendorRecord() {
      const updateForm = document.getElementById("updateForm");
      if (!currentRecordId) {
        setMessage("updateMessage", "Load a Record ID first.", "err");
        return;
      }

      applyConditionalRequiredRules();
      if (updateForm && !updateForm.checkValidity()) {
        updateForm.reportValidity();
        setMessage("updateMessage", "Please fill all mandatory fields before update.", "err");
        return;
      }

      const updates = collectUpdatePayload();
      const reuploadSelections = collectReuploadSelections();
      if (!Object.keys(updates).length && !reuploadSelections.length) {
        setMessage("updateMessage", "No fields found to update.", "err");
        return;
      }
      const missingUploads = reuploadSelections.filter((item) => !item.file);
      if (missingUploads.length) {
        const labels = missingUploads.map((item) => item.label).join(", ");
        setMessage("updateMessage", `Please upload new file for: ${labels}.`, "err");
        return;
      }

      setMessage("updateMessage", `Updating ${recordTypeLabel.toLowerCase()} record...`);
      try {
        const formData = new FormData();
        formData.append("recordId", currentRecordId);
        formData.append("updates", JSON.stringify(updates));

        const docSourceMap = {};
        reuploadSelections.forEach((item) => {
          if (!item.fieldName || !item.file) return;
          docSourceMap[item.fieldName] = item.sourceKey || item.fieldName;
          formData.append(`file_${item.fieldName}`, item.file, item.file.name || item.fieldName);
        });
        if (Object.keys(docSourceMap).length) {
          formData.append("docSourceMap", JSON.stringify(docSourceMap));
        }

        const res = await fetch(`${getRecordApiBase()}/update-record-with-files`, {
          method: "PUT",
          headers: buildAuthHeaders(),
          body: formData,
        });
        const data = await parseApiResponse(res);
        if (!res.ok) {
          throw new Error(data.detail || `Unable to update ${recordTypeLabel.toLowerCase()} record`);
        }

        currentVendor = data.vendor || currentVendor;
        renderMeta(currentVendor, currentRecordId);
        renderEditableSections(currentVendor);
        bindUpdateRemarksField(currentVendor);
        const nextStatus = String(data.approverStatus || currentVendor.approverStatus || "").trim();
        const successMessage = String(data.message || `${recordTypeLabel} record updated successfully.`).trim();
        setMessage(
          "updateMessage",
          nextStatus ? `${successMessage} (Status: ${nextStatus})` : successMessage,
          "ok"
        );
      } catch (err) {
        setMessage("updateMessage", err.message || `Unable to update ${recordTypeLabel.toLowerCase()} record.`, "err");
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      if (window.location.search) {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      const entryForm = document.getElementById("entryForm");
      const updateForm = document.getElementById("updateForm");
      const recordIdInput = document.getElementById("recordIdInput");
      const goBackBtn = document.getElementById("goBackBtn");
      const entryHeading = document.getElementById("entryHeading");
      const editHeading = document.getElementById("editHeading");
      const loadEntryBtn = document.getElementById("loadEntryBtn");
      const updateBtn = document.getElementById("updateBtn");
      const recordIdLabel = document.getElementById("recordIdLabel");

      if (isCustomerPortal) {
        document.title = "Update Customer Form";
        if (entryHeading) entryHeading.textContent = "Update Customer Form";
        if (editHeading) editHeading.textContent = "Editable Customer Registration Form";
        if (loadEntryBtn) loadEntryBtn.textContent = "Load Customer Form";
        if (updateBtn) updateBtn.textContent = "Update Customer Record";
        if (recordIdLabel) recordIdLabel.textContent = "Entry Page - Record ID";
        if (recordIdInput) {
          recordIdInput.placeholder = "Enter Customer Record ID";
        }
      }

      if (isShipToOnlyMode) {
        document.title = "Update Customer Ship-to Address";
        if (entryHeading) entryHeading.textContent = "Update Customer Ship-to Address";
        if (editHeading) editHeading.textContent = "Editable Ship-to Address";
        if (loadEntryBtn) loadEntryBtn.textContent = "Load Ship-to Details";
        if (updateBtn) updateBtn.textContent = "Update Ship-to Address";
        if (recordIdLabel) recordIdLabel.textContent = "Ship-to Entry - Record ID";
        if (recordIdInput) {
          recordIdInput.placeholder = "Enter Customer Record ID";
        }
      }

      if (goBackBtn) {
        goBackBtn.addEventListener("click", () => {
          window.location.href = getBackUrl();
        });
      }

      entryForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const recordId = String(recordIdInput.value || "").trim();
        if (!recordId) {
          setMessage("entryMessage", "Record ID is required.", "err");
          return;
        }
        loadVendorByRecordId(recordId);
      });

      updateForm.addEventListener("submit", (event) => {
        event.preventDefault();
        updateVendorRecord();
      });

      if (initialRecordIdFromQuery) {
        if (recordIdInput) {
          recordIdInput.value = initialRecordIdFromQuery;
        }
        loadVendorByRecordId(initialRecordIdFromQuery);
      }

    });
  </script>
