<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vendor Registration</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 20px; color: #1f2937; }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .page-header { background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 20px rgba(2, 6, 23, .08); margin-bottom: 12px; display: grid; grid-template-columns: 180px 1fr auto; gap: 14px; align-items: center; }
    .brand-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .brand-art { width: 160px; max-width: 100%; height: auto; display: block; }
    .brand-text { text-align: center; font-size: 20px; line-height: 1.4; color: #475569; font-weight: 700; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); }
    h1 { margin-top: 0; font-size: 26px; color: #1e3a8a; }
    label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 6px; color: #334155; }
    input, button { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; }
    button { background: #1d4ed8; color: #fff; border: none; font-weight: 700; cursor: pointer; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar button { width: auto; padding: 10px 14px; }
    .subcard { background: #f8fbff; border: 1px solid #dbeafe; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
    .subcard h3 { margin: 0 0 12px; font-size: 16px; color: #1e3a8a; }
    .row { margin-bottom: 10px; max-width: 420px; }
    .actions { margin-top: 10px; display: flex; justify-content: flex-start; }
    .actions button { width: auto; min-width: 120px; padding: 10px 16px; }
    .actions.hidden { display: none; }
    .msg { margin-top: 14px; font-size: 14px; color: #b3261e; white-space: pre-wrap; }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div class="brand-left">
        <img src="/web/header-art-image" alt="Header Art" class="brand-art" />
      </div>
      <div class="brand-text">Sharp & Tannan Chartered Accountants</div>
      <div></div>
    </div>
    <div class="toolbar">
      <button type="button" onclick="location.href='/web/vendor-dashboard'">Go Back</button>
      <button type="button" onclick="location.href='/web/login'">Go to Login</button>
      <button type="button" onclick="logout()">Logout</button>
    </div>
    <div class="card">
      <h1 id="portalTitle">Vendor Registration Portal</h1>
      <div class="subcard">
        <h3>Fill Details</h3>
        <form id="recordStepForm">
          <div class="row">
            <label for="recordIdInput">Record ID</label>
            <input id="recordIdInput" name="recordId" autocomplete="off" required />
          </div>
          <div id="nextActions" class="actions hidden">
            <button type="submit">Go Next</button>
          </div>
        </form>
        <div id="message" class="msg"></div>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedFlow = String(params.get("flow") || "domestic").trim().toLowerCase();
    const requiresSessionLogin = requestedFlow === "internal";

    function requireSessionLogin() {
      if (!requiresSessionLogin || sessionStorage.getItem("token")) {
        return;
      }
      fetch("/api/auth/logout", { method: "POST", keepalive: true }).catch(() => {});
      window.location.replace("/web/login");
    }

    requireSessionLogin();
    function createToastManager() {
      const host = document.createElement("div");
      host.style.position = "fixed";
      host.style.top = "20px";
      host.style.right = "20px";
      host.style.zIndex = "5000";
      document.body.appendChild(host);

      let activeToast = null;
      let activeTimer = null;

      function removeToast(toast) {
        if (!toast) return;
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 200);
        if (activeToast === toast) {
          activeToast = null;
        }
      }

      return function showToast(text, kind = "info", duration = 10000) {
        if (!text) return;
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        if (activeToast) {
          activeToast.remove();
          activeToast = null;
        }

        const colors = {
          ok: "#166534",
          err: "#b91c1c",
          info: "#1d4ed8",
        };

        const toast = document.createElement("div");
        toast.textContent = text;
        toast.style.minWidth = "280px";
        toast.style.maxWidth = "420px";
        toast.style.padding = "14px 16px";
        toast.style.borderRadius = "12px";
        toast.style.boxShadow = "0 12px 32px rgba(15, 23, 42, 0.24)";
        toast.style.background = colors[kind] || colors.info;
        toast.style.color = "#fff";
        toast.style.fontSize = "14px";
        toast.style.fontWeight = "700";
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        toast.style.transition = "opacity .2s ease, transform .2s ease";

        host.appendChild(toast);
        requestAnimationFrame(() => {
          toast.style.opacity = "1";
          toast.style.transform = "translateY(0)";
        });

        activeToast = toast;
        if (duration > 0) {
          activeTimer = setTimeout(() => removeToast(toast), duration);
        }
      };
    }

    const showToast = createToastManager();
    async function logout() {
      await fetch("/api/auth/logout", { method: "POST" });
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");
      sessionStorage.removeItem("name");
      window.location.href = "/web/login";
    }

    const form = document.getElementById("recordStepForm");
    const recordIdInput = document.getElementById("recordIdInput");
    const nextActions = document.getElementById("nextActions");
    const message = document.getElementById("message");
    if (message) {
      message.style.display = "none";
    }
    const portalTitle = document.getElementById("portalTitle");
    const isImportFlow = requestedFlow === "import";
    const preScreenPath = isImportFlow
      ? "/web/vendor-registration/prescreen?flow=import"
      : "/web/vendor-registration/prescreen";

    if (portalTitle && isImportFlow) {
      portalTitle.textContent = "Import Vendor Registration Portal";
      document.title = "Import Vendor Registration";
    }

    function toggleNextButton() {
      const hasValue = String(recordIdInput.value || "").trim().length > 0;
      nextActions.classList.toggle("hidden", !hasValue);
      if (hasValue) {
        message.textContent = "";
      }
    }

    recordIdInput.addEventListener("input", toggleNextButton);
    recordIdInput.addEventListener("change", toggleNextButton);
    const prefetchedRecordId = String(params.get("recordId") || "").trim();
    if (prefetchedRecordId) {
      recordIdInput.value = prefetchedRecordId;
    }
    toggleNextButton();

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const recordId = String(recordIdInput.value || "").trim();
      if (!recordId) {
        showToast("Please enter Record ID.", "err");
        recordIdInput.focus();
        return;
      }

      sessionStorage.setItem("vendorRegistrationRecordId", recordId);
      if (isImportFlow) {
        sessionStorage.setItem("importVendorRegistrationRecordId", recordId);
      }
      window.location.href = preScreenPath;
    });
  </script>
</body>
</html>
