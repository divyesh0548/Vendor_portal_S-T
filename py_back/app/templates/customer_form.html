<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Export Customer Form</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 20px; color: #1f2937; }
    .wrap { max-width: 1280px; margin: 0 auto; }
    .page-header { background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 20px rgba(2, 6, 23, .08); margin-bottom: 12px; display: grid; grid-template-columns: 180px 1fr auto; gap: 14px; align-items: center; }
    .brand-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .brand-art { width: 160px; max-width: 100%; height: auto; display: block; }
    .brand-text { text-align: center; font-size: 20px; line-height: 1.4; color: #475569; font-weight: 700; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar button { width: auto; padding: 10px 14px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); }
    h1 { margin: 0 0 12px; color: #1e3a8a; }
    h2 { margin: 20px 0 10px; font-size: 18px; color: #1e3a8a; border-bottom: 1px solid #dbeafe; padding-bottom: 6px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .row { display: grid; gap: 6px; }
    .full { grid-column: 1 / -1; }
    label { font-size: 12px; font-weight: 700; color: #334155; }
    .req-star { color: #dc2626; margin-left: 4px; font-weight: 700; }
    input, select, textarea, button { width: 100%; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; font-size: 14px; }
    textarea { min-height: 90px; resize: vertical; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
    button { background: #1d4ed8; color: #fff; border: none; font-weight: 800; cursor: pointer; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .msg { margin-top: 12px; font-size: 14px; white-space: pre-wrap; }
    .msg.ok { color: #166534; }
    .msg.err { color: #b91c1c; }
    .hidden { display: none !important; }
    .row.pincode-spinner-host { position: relative; }
    .pincode-with-spinner { padding-right: 34px; }
    .pincode-spinner {
      position: absolute;
      right: 10px;
      top: 50%;
      width: 14px;
      height: 14px;
      margin-top: -7px;
      border: 2px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: pincodeSpin .7s linear infinite;
      display: none;
      pointer-events: none;
    }
    .pincode-spinner.active { display: block; }
    @keyframes pincodeSpin { to { transform: rotate(360deg); } }
    @media (max-width: 980px) {
      .page-header { grid-template-columns: 1fr; text-align: center; }
      .brand-left { align-items: center; }
      .grid { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div class="brand-left">
        <img src="/web/header-art-image" alt="Header Art" class="brand-art" />
      </div>
      <div class="brand-text">Sharp & Tannan Chartered Accountants</div>
      <div></div>

    <div class="toolbar">
      <button type="button" onclick="location.href='/web/customer-dashboard'">Go Back</button>
      <button type="button" onclick="logoutAndRedirect()">Logout</button>

    <div class="card">
      <h1>Export Customer Registration Form</h1>

      <form id="exportCustomerForm" enctype="multipart/form-data">
        <input type="hidden" id="recordId" name="recordId" />

        <h2>Basic Details</h2>
        <div class="grid">
          <div class="row">
            <label for="CompanyDealing">Company Dealing With <span class="req-star">*</span></label>
            <select id="CompanyDealing" name="CompanyDealing" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="CustomerName">Customer Name <span class="req-star">*</span></label>
            <input type="text" id="CustomerName" name="CustomerName" required />
          </div>
          <div class="row">
            <label for="FirmType">Type of Firm <span class="req-star">*</span></label>
            <select id="FirmType" name="FirmType" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="ManufacturingType">Type of Manufacturing <span class="req-star">*</span></label>
            <select id="ManufacturingType" name="ManufacturingType" required><option value="">Select</option></select>
          </div>
          <div class="row full">
            <label for="MaterialDealing">Material Dealing In <span class="req-star">*</span></label>
            <textarea id="MaterialDealing" name="MaterialDealing" required></textarea>
          </div>
          <div class="row full">
            <label for="ServiceDealing">Service Dealing In <span class="req-star">*</span></label>
            <textarea id="ServiceDealing" name="ServiceDealing" required></textarea>
          </div>
        </div>

        <h2>Address Details</h2>
        <div class="grid">
          <div class="row">
            <label for="Lane1">Address Lane 1 <span class="req-star">*</span></label>
            <input type="text" id="Lane1" name="Lane1" required />
          </div>
          <div class="row">
            <label for="Lane2">Address Lane 2</label>
            <input type="text" id="Lane2" name="Lane2" />
          </div>
          <div class="row">
            <label for="Lane3">Address Lane 3</label>
            <input type="text" id="Lane3" name="Lane3" />
          </div>
          <div class="row">
            <label for="Pincode">Pincode <span class="req-star">*</span></label>
            <input type="text" id="Pincode" name="Pincode" required inputmode="numeric" />
          </div>
          <div class="row">
            <label for="Country">Country</label>
            <select id="Country" name="Country"><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="State_Name">State <span class="req-star">*</span></label>
            <input type="text" id="State_Name" name="State_Name" required />
          </div>
          <div class="row">
            <label for="District">District <span class="req-star">*</span></label>
            <input type="text" id="District" name="District" required />
          </div>
          <div class="row">
            <label for="Shipto">Ship to Address - Same as Above</label>
            <select id="Shipto" name="Shipto"><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="Billto">Bill to Address - Same as Above</label>
            <select id="Billto" name="Billto"><option value="">Select</option></select>
          </div>
        </div>

        <div id="shipAddressContainer" class="hidden">
          <h2>Ship-to-Address Details - 1</h2>
          <div class="grid">
            <div class="row">
              <label for="Lane4">Address Lane 1 <span class="req-star">*</span></label>
              <input type="text" id="Lane4" name="Lane4" />
            </div>
            <div class="row">
              <label for="Lane5">Address Lane 2</label>
              <input type="text" id="Lane5" name="Lane5" />
            </div>
            <div class="row">
              <label for="Lane6">Address Lane 3</label>
              <input type="text" id="Lane6" name="Lane6" />
            </div>
            <div class="row">
              <label for="Pincode1">Pincode <span class="req-star">*</span></label>
              <input type="text" id="Pincode1" name="Pincode1" inputmode="numeric" />
            </div>
            <div class="row">
              <label for="StateName1">State <span class="req-star">*</span></label>
              <input type="text" id="StateName1" name="StateName1" />
            </div>
            <div class="row">
              <label for="District1">District <span class="req-star">*</span></label>
              <input type="text" id="District1" name="District1" />
            </div>
          </div>

          <h2>Ship-to-Address Details - 2</h2>
          <div class="grid">
            <div class="row">
              <label for="Lane7">Address Lane 1 <span class="req-star">*</span></label>
              <input type="text" id="Lane7" name="Lane7" />
            </div>
            <div class="row">
              <label for="Lane8">Address Lane 2</label>
              <input type="text" id="Lane8" name="Lane8" />
            </div>
            <div class="row">
              <label for="Lane9">Address Lane 3</label>
              <input type="text" id="Lane9" name="Lane9" />
            </div>
            <div class="row">
              <label for="Pincode2">Pincode <span class="req-star">*</span></label>
              <input type="text" id="Pincode2" name="Pincode2" inputmode="numeric" />

            <div class="row">
              <label for="State2">State <span class="req-star">*</span></label>
              <input type="text" id="State2" name="State2" />
            </div>
            <div class="row">
              <label for="District2">District <span class="req-star">*</span></label>
              <input type="text" id="District2" name="District2" />
            </div>
          </div>
        </div>

        <h2>Customer - Single point of contact Details</h2>

          <div class="row">
            <label for="FurnishBy">Information Furnished By <span class="req-star">*</span></label>
            <input type="text" id="FurnishBy" name="FurnishBy" required />
          </div>
          <div class="row">
            <label for="Designation">Designation</label>
            <input type="text" id="Designation" name="Designation" />
          </div>
          <div class="row">
            <label for="Email">Email <span class="req-star">*</span></label>
            <input type="email" id="Email" name="Email" required />

          <div class="row">
            <label for="Mobile">Mobile <span class="req-star">*</span></label>
            <input type="tel" id="Mobile" name="Mobile" required />

          <div class="row">
            <label for="Datepicker">Date</label>

          <div class="row">
            <label for="Place">Place <span class="req-star">*</span></label>
            <input type="text" id="Place" name="Place" required />

          <div class="row">
            <label for="AP_Mobile1">Mobile</label>
            <input type="tel" id="AP_Mobile1" name="AP_Mobile1" />

        </div>

        <h2>Sharp & Tannan Team</h2>
        <div class="grid">
          <div class="row">
            <label for="IncoTerms">Inco Terms <span class="req-star">*</span></label>
            <select id="IncoTerms" name="IncoTerms" required><option value="">Select</option></select>

            <label for="PaymentTerms">Payment Terms <span class="req-star">*</span></label>

          <div class="row">
            <label for="CustomerGroup">Customer Group</label>

          <div class="row">

            <select id="HODEmail" name="HODEmail" required><option value="">Select</option></select>

          <div class="row">
            <label for="SalesOrganization">Sales Organization <span class="req-star">*</span></label>
            <select id="SalesOrganization" name="SalesOrganization" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="DistributionChannel">Distribution Channel <span class="req-star">*</span></label>
            <select id="DistributionChannel" name="DistributionChannel" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="Division">Division <span class="req-star">*</span></label>
            <select id="Division" name="Division" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="AccountAssignment">Account Assignment <span class="req-star">*</span></label>
            <select id="AccountAssignment" name="AccountAssignment" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="IndustryType">Industry Type <span class="req-star">*</span></label>
            <select id="IndustryType" name="IndustryType" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="ScrapSales">Scrap Sales <span class="req-star">*</span></label>
            <select id="ScrapSales" name="ScrapSales" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="CustomerType">Customer Type <span class="req-star">*</span></label>
            <select id="CustomerType" name="CustomerType" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="Currency">Currency <span class="req-star">*</span></label>
            <select id="Currency" name="Currency" required><option value="">Select</option></select>
          </div>
          <div class="row">
            <label for="InsuranceLimit">Insurance Limit</label>
            <input type="number" id="InsuranceLimit" name="InsuranceLimit" />
          </div>
          <div class="row">
            <label for="CreditLimit">Credit Limit</label>
            <input type="number" id="CreditLimit" name="CreditLimit" />
          </div>
        </div>

        <h2>Upload Documents</h2>
        <div class="grid">
          <div class="row">
            <label for="FileUploader">Upload Document 1</label>
            <input type="file" id="FileUploader" name="FileUploader" />
          </div>
          <div class="row">
            <label for="FileUploader1">Upload Document 2</label>
            <input type="file" id="FileUploader1" name="FileUploader1" />
          </div>
          <div class="row">
            <label for="FileUploader2">Upload Document 3</label>
            <input type="file" id="FileUploader2" name="FileUploader2" />
          </div>
          <div class="row">
            <label for="FileUploader3">Upload Document 4</label>
            <input type="file" id="FileUploader3" name="FileUploader3" />
          </div>
          <div class="row">
            <label for="FileUploader4">Upload Document 5</label>
            <input type="file" id="FileUploader4" name="FileUploader4" />
          </div>
          <div class="row">
            <label for="FileUploader5">Upload Document 6</label>
            <input type="file" id="FileUploader5" name="FileUploader5" />
          </div>
        </div>

        <div class="actions">
          <button id="submitBtn" type="submit">Submit</button>
        </div>
        <div id="message" class="msg"></div>
      </form>
    </div>
  </div>

    function fillSelect(selectEl, values, placeholder = "Select") {
      if (!selectEl) return;
      const current = String(selectEl.value || "");
      const opts = Array.isArray(values) ? values : [];
      selectEl.innerHTML = `<option value="">${placeholder}</option>`;
      for (const val of opts) {
        const option = document.createElement("option");
        option.value = val;
        option.textContent = val;
        selectEl.appendChild(option);
      }
      if (current && opts.includes(current)) selectEl.value = current;
    }

        fillSelect(el, values, placeholder);

      for (const [key, values] of Object.entries(RADIO_OPTIONS)) {
        const el = document.getElementById(key);

      const country = document.getElementById("Country");
      if (country && !country.value) country.value = "India";

    async function parseLookupResponse(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return {};
      }
    }

    function normalizeIndianPincode(value) {
      return String(value || "").replace(/\D/g, "");
    }

    function ensureSelectHasOption(selectEl, value) {
      if (!selectEl || !value) return;
      const normalizedValue = String(value).trim();
      if (!normalizedValue) return;
      const hasOption = Array.from(selectEl.options).some((option) => option.value === normalizedValue);
      if (hasOption) return;
      const option = document.createElement("option");
      option.value = normalizedValue;
      option.textContent = normalizedValue;
      selectEl.appendChild(option);
    }

    function setAddressFieldValue(fieldId, value) {
      const field = document.getElementById(fieldId);
      const nextValue = String(value || "").trim();
      if (!field || !nextValue) return;
      if (field.tagName === "SELECT") {
        ensureSelectHasOption(field, nextValue);
      }
      field.value = nextValue;
    }

    function applyPincodeLookupToAddress(mapping, details) {
      if (!mapping || !details) return;
      if (mapping.countryId) {
        setAddressFieldValue(mapping.countryId, details.country);
      }
      setAddressFieldValue(mapping.stateId, details.state);
      setAddressFieldValue(mapping.districtId, details.district);
    }

    function setupPincodeLookupForAddress(mapping) {
      const pincodeInput = document.getElementById(mapping.pincodeId);
      if (!pincodeInput) return;
      const spinnerHost = pincodeInput.closest(".row");
      if (spinnerHost) {
        spinnerHost.classList.add("pincode-spinner-host");
      }
      pincodeInput.classList.add("pincode-with-spinner");
      const spinnerEl = document.createElement("span");
      spinnerEl.className = "pincode-spinner";
      if (spinnerHost) {
        spinnerHost.appendChild(spinnerEl);
      }
      const setSpinner = (loading) => {
        spinnerEl.classList.toggle("active", !!loading);
      };

      let lookupCounter = 0;
      let lastLookupValue = "";

      const triggerLookup = async () => {
        const normalized = normalizeIndianPincode(pincodeInput.value);
        if (normalized.length !== 6) {
          lastLookupValue = "";
          setSpinner(false);
          return;
        }
        if (normalized === lastLookupValue) {
          setSpinner(false);
          return;
        }

        const requestId = ++lookupCounter;
        setSpinner(true);
        try {
          const res = await fetch(`/api/pincode/${encodeURIComponent(normalized)}`);
          const data = await parseLookupResponse(res);
          if (requestId !== lookupCounter || !res.ok) {
            return;
          }
          applyPincodeLookupToAddress(mapping, data);
          lastLookupValue = normalized;
          syncAddressCopy();
        } catch (_) {
        } finally {
          if (requestId === lookupCounter) {
            setSpinner(false);
          }
        }
      };

      pincodeInput.addEventListener("input", triggerLookup);
      pincodeInput.addEventListener("change", triggerLookup);
      pincodeInput.addEventListener("blur", triggerLookup);
    }

    function setupPincodeLookups() {
      const mappings = [
        { pincodeId: "Pincode", countryId: "Country", stateId: "State_Name", districtId: "District" },
        { pincodeId: "Pincode1", countryId: "Country", stateId: "StateName1", districtId: "District1" },
        { pincodeId: "Pincode2", countryId: "Country", stateId: "State2", districtId: "District2" },
      ];
      mappings.forEach(setupPincodeLookupForAddress);
    }

    function setFieldValue(fieldName, value) {
      if (value === null || value === undefined) return;
      const el = document.getElementById(fieldName);
      if (!el || el.type === "file") return;
      const text = String(value);
      if (el.tagName === "SELECT" && !Array.from(el.options).some((opt) => opt.value === text)) {
        const option = document.createElement("option");
        option.value = text;
        option.textContent = text;
        el.appendChild(option);
      }
      el.value = text;
    }

    function copyAddressBlockIfNeeded(flagValue, source, target) {
      if (flagValue !== "Yes") return;
      const copy = (fromName, toName) => {
        const from = document.getElementById(fromName);
        const to = document.getElementById(toName);
        if (!from || !to) return;
        to.value = from.value;
      };
      copy(source.lane1, target.lane1);
      copy(source.lane2, target.lane2);
      copy(source.lane3, target.lane3);
      copy(source.pincode, target.pincode);
      copy(source.state, target.state);
      copy(source.district, target.district);
    }

    function syncAddressCopy() {
      const shipTo = document.getElementById("Shipto")?.value;
      copyAddressBlockIfNeeded(
        shipTo,
        { lane1: "Lane1", lane2: "Lane2", lane3: "Lane3", pincode: "Pincode", state: "State_Name", district: "District" },
        { lane1: "Lane4", lane2: "Lane5", lane3: "Lane6", pincode: "Pincode1", state: "StateName1", district: "District1" }
      );
      copyAddressBlockIfNeeded(
        shipTo,
        { lane1: "Lane1", lane2: "Lane2", lane3: "Lane3", pincode: "Pincode", state: "State_Name", district: "District" },

    function syncShipAddressVisibility() {
      const shipTo = String(document.getElementById("Shipto")?.value || "");
      const showShipAddress = shipTo === "No";
      const container = document.getElementById("shipAddressContainer");
      if (container) container.classList.toggle("hidden", !showShipAddress);

      const shipRequiredFields = ["Lane4", "Pincode1", "StateName1", "District1", "Lane7", "Pincode2", "State2", "District2"];
      for (const fieldName of shipRequiredFields) {
        const el = document.getElementById(fieldName);

    function syncSalesDependentDropdowns() {
      const salesEl = document.getElementById("SalesOrganization");
      const distEl = document.getElementById("DistributionChannel");
      const divEl = document.getElementById("Division");
      if (!salesEl || !distEl || !divEl) return;

      const salesVal = String(salesEl.value || "");

      if (distVal && distOptions.includes(distVal)) distEl.value = distVal;

      const divisionOptions = (DIVISION_MAP[salesVal] && DIVISION_MAP[salesVal][distEl.value]) || [];

      if (divVal && divisionOptions.includes(divVal)) divEl.value = divVal;

      try {

        const rows = await res.json();
        const values = Array.from(new Set((Array.isArray(rows) ? rows : [])

          .filter((email) => email)));
        fillSelect(hodEl, values, "Select");
        if (current) {
          if (!values.includes(current)) {
            const option = document.createElement("option");
            option.value = current;
            option.textContent = current;
            hodEl.appendChild(option);
          }
          hodEl.value = current;
        }
      } catch (_) {
      }
    }

            border-color: #60a5fa;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(59, 130, 246, .16);
          }
          .dynamic-selector-item.dynamic-selected {
            border-color: #2563eb;
            background: #dbeafe;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, .14);
          }
          .dynamic-selector-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: #1d4ed8;
            flex: 0 0 auto;
          }
          .dynamic-selector-item-title {
            font-size: 15px;
            line-height: 1.25;
            font-weight: 700;
            color: #1e293b;
          }
          .dynamic-selector-toolbar {
            margin-top: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
          }
          .dynamic-selector-count {
            padding: 4px 10px;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            background: #e0ecff;
            color: #1e3a8a;
            font-size: 13px;
            font-weight: 700;
          }
          .dynamic-selector-note {
            font-size: 12px;
            color: #475569;
          }
          .dynamic-selector-actions {
            margin-top: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap-reverse;
          }
          .dynamic-selector-actions #dynamicSelectorSaveNext {
            width: auto;
            min-width: 170px;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: .2px;
            box-shadow: 0 6px 14px rgba(29, 78, 216, .24);
          }
          .dynamic-selector-message {
            min-height: 18px;
            font-size: 13px;
            font-weight: 700;
            color: #b91c1c;
          }
          .dynamic-selector-hidden { display: none !important; }
          @media (max-width: 760px) {
            .dynamic-selector-card { padding: 14px; }
            .dynamic-selector-title { font-size: 20px; }
            .dynamic-selector-grid { grid-template-columns: 1fr; }
            .dynamic-selector-item { padding: 11px 12px; }
            .dynamic-selector-actions { align-items: stretch; }
            .dynamic-selector-actions #dynamicSelectorSaveNext { width: 100%; }
            .dynamic-selector-message { width: 100%; }
          }
        `;
        document.head.appendChild(style);
      }

      const directChildren = Array.from(formEl.children);
      const groups = [];
      const auxNodes = [];
      const headingNodes = new Set();
      const alwaysVisibleGroupIds = new Set();
      const isAlwaysVisibleGroup = (title) => /declaration/i.test(String(title || ""));

      const isEligibleControl = (control) => {
        const tag = String(control.tagName || "").toLowerCase();
        if (!["input", "select", "textarea"].includes(tag)) return false;
        const type = String(control.type || "").toLowerCase();
        if (["hidden", "button", "submit", "reset", "image"].includes(type)) return false;
        return true;
      };

      const subcards = directChildren.filter(
        (node) => node.classList && node.classList.contains("subcard") && !node.classList.contains("dynamic-selector-card")
      );
      const hasSubcardMode = subcards.length >= 3;

      if (hasSubcardMode) {
        subcards.forEach((card, idx) => {
          const titleEl = card.querySelector("h3");
          const title = (titleEl ? String(titleEl.textContent || "") : "").trim() || `Section ${idx + 1}`;
          const controls = Array.from(card.querySelectorAll("input, select, textarea")).filter(isEligibleControl);
          if (!controls.length) return;

          let heading = card.previousElementSibling;
          while (heading && heading.tagName !== "H2") {
            heading = heading.previousElementSibling;
          }
          if (heading) {
            headingNodes.add(heading);
          }

          const groupId = `sec_${idx + 1}`;
          const group = {
            id: groupId,
            title,
            nodes: [card],
            controls,
            heading,
          };
          if (isAlwaysVisibleGroup(title)) {
            alwaysVisibleGroupIds.add(groupId);
          }
          groups.push(group);
        });

        directChildren.forEach((node) => {
          if (node.classList && node.classList.contains("dynamic-selector-card")) return;
          if (node.tagName === "H2") return;
          if (node.classList && node.classList.contains("subcard")) return;
          auxNodes.push(node);
        });
      } else {
        let index = 0;
        let sectionCounter = 0;
        while (index < directChildren.length) {
          const current = directChildren[index];
          if (current.classList && current.classList.contains("dynamic-selector-card")) {
            index += 1;
            continue;
          }
          if (current.tagName !== "H2") {
            auxNodes.push(current);
            index += 1;
            continue;
          }

          const nodes = [current];
          index += 1;
          while (index < directChildren.length) {
            const nextNode = directChildren[index];
            if (nextNode.classList && nextNode.classList.contains("dynamic-selector-card")) {
              index += 1;
              continue;
            }
            if (nextNode.tagName === "H2") break;
            nodes.push(nextNode);
            index += 1;
          }

          const controls = nodes
            .flatMap((node) => Array.from((node.querySelectorAll && node.querySelectorAll("input, select, textarea")) || []))
            .filter(isEligibleControl);
          if (!controls.length) {
            continue;
          }
          sectionCounter += 1;
          const groupTitle = String(current.textContent || "").trim() || `Section ${sectionCounter}`;
          const groupId = `sec_${sectionCounter}`;
          const group = {
            id: groupId,
            title: groupTitle,
            nodes,
            controls,
            heading: null,
          };
          if (isAlwaysVisibleGroup(groupTitle)) {
            alwaysVisibleGroupIds.add(groupId);
          }
          groups.push(group);
        }
      }

      if (!groups.length) return;

      const hiddenSelectedInput = document.createElement("input");
      hiddenSelectedInput.type = "hidden";
      hiddenSelectedInput.name = "selectedSections";
      hiddenSelectedInput.value = "";
      formEl.prepend(hiddenSelectedInput);

      const selectorCard = document.createElement("div");
      selectorCard.className = "subcard dynamic-selector-card";
      selectorCard.innerHTML = `
        <div class="dynamic-selector-header">
          <div>
            <h3 class="dynamic-selector-title">Select Form Sections</h3>
            <p class="dynamic-selector-subtitle">Choose the field containers you want to fill. After clicking <strong>Save & Next</strong>, only selected sections will be shown and all visible fields become mandatory.</p>
          </div>
          <div class="dynamic-selector-pill">Step 1 of 2</div>
        </div>
        <div class="dynamic-selector-grid" role="group" aria-label="Form section selection"></div>
        <div class="dynamic-selector-toolbar">
          <div class="dynamic-selector-count" id="dynamicSelectorCount">0 sections selected</div>
          <div class="dynamic-selector-note">Declaration stays compulsory for every form.</div>
        </div>
        <div class="dynamic-selector-actions">
          <div class="dynamic-selector-message" id="dynamicSelectorMessage"></div>
          <button type="button" id="dynamicSelectorSaveNext">Save & Next</button>
        </div>
      `;
      formEl.prepend(selectorCard);

      const listEl = selectorCard.querySelector(".dynamic-selector-grid");
      const messageEl = selectorCard.querySelector("#dynamicSelectorMessage");
      const saveNextBtn = selectorCard.querySelector("#dynamicSelectorSaveNext");
      const countEl = selectorCard.querySelector("#dynamicSelectorCount");

      groups
        .filter((group) => !alwaysVisibleGroupIds.has(group.id))
        .forEach((group) => {
          const item = document.createElement("label");
          item.className = "dynamic-selector-item";
          item.innerHTML = `<input type="checkbox" value="${group.id}" /> <span class="dynamic-selector-item-title">${group.title}</span>`;
          listEl.appendChild(item);
        });

      const checkboxEls = Array.from(listEl.querySelectorAll("input[type='checkbox']"));
      const updateSelectionSummary = () => {
        let selectedCount = 0;
        checkboxEls.forEach((checkbox) => {
          const selected = checkbox.checked;
          checkbox.closest(".dynamic-selector-item")?.classList.toggle("dynamic-selected", selected);
          if (selected) selectedCount += 1;
        });
        if (countEl) {
          countEl.textContent = `${selectedCount} section${selectedCount === 1 ? "" : "s"} selected`;
        }
      };
      checkboxEls.forEach((checkbox) => checkbox.addEventListener("change", updateSelectionSummary));
      updateSelectionSummary();

      const setControlState = (control, visible) => {
        if (!control.dataset.dynamicPrevDisabled) {
          control.dataset.dynamicPrevDisabled = control.disabled ? "1" : "0";
        }

        if (!visible) {
          control.required = false;
          control.disabled = true;
          return;
        }

        control.disabled = control.dataset.dynamicPrevDisabled === "1";
        if (control.disabled || control.readOnly) {
          control.required = false;
          return;
        }
        control.required = true;
      };

      const applyVisibility = (selectedIds) => {
        groups.forEach((group) => {
          const visible = alwaysVisibleGroupIds.has(group.id) || selectedIds.has(group.id);
          group.nodes.forEach((node) => node.classList.toggle("dynamic-selector-hidden", !visible));
          group.controls.forEach((control) => setControlState(control, visible));
        });

        if (hasSubcardMode) {
          headingNodes.forEach((heading) => heading.classList.add("dynamic-selector-hidden"));
          groups.forEach((group) => {
            if ((alwaysVisibleGroupIds.has(group.id) || selectedIds.has(group.id)) && group.heading) {
              group.heading.classList.remove("dynamic-selector-hidden");
            }
          });
        }

        auxNodes.forEach((node) => node.classList.remove("dynamic-selector-hidden"));
      };

      groups.forEach((group) => {
        group.nodes.forEach((node) => node.classList.add("dynamic-selector-hidden"));
        group.controls.forEach((control) => setControlState(control, false));
      });
      headingNodes.forEach((heading) => heading.classList.add("dynamic-selector-hidden"));
      auxNodes.forEach((node) => {
        if (node !== hiddenSelectedInput) {
          node.classList.add("dynamic-selector-hidden");
        }
      });

      saveNextBtn.addEventListener("click", () => {
        const selectedIds = new Set(
          Array.from(listEl.querySelectorAll("input[type='checkbox']:checked")).map((input) => input.value)
        );

        if (!selectedIds.size) {
          if (messageEl) messageEl.textContent = "Select at least one section to continue.";
          return;
        }

        if (messageEl) messageEl.textContent = "";
        applyVisibility(selectedIds);

        const selectedTitles = groups
          .filter((group) => selectedIds.has(group.id))
          .map((group) => group.title);
        hiddenSelectedInput.value = JSON.stringify(selectedTitles);

        selectorCard.classList.add("dynamic-selector-hidden");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    initDynamicSectionSelection(form);
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      syncShipAddressVisibility();
      syncAddressCopy();
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      setMessage("Submitting...", "");
      if (submitBtn) submitBtn.disabled = true;

      try {
        const fd = new FormData(form);
        const res = await fetch("/api/customer/internal-submit", { method: "POST", body: fd });
        const text = await res.text();
        let data = {};
        try { data = text ? JSON.parse(text) : {}; } catch (_) { data = { detail: text }; }
        if (!res.ok) throw new Error(data.detail || "Unable to submit form");
        setMessage("Submitted successfully.", "ok");
        setTimeout(() => { window.location.href = "/web/customer-dashboard"; }, 800);
      } catch (err) {
        setMessage(err.message || "Unable to submit form", "err");
      } finally {
        if (submitBtn) submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
