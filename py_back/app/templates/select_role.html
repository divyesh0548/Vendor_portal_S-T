<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Select role</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2ff;
      margin: 0;
      padding: 20px;
      color: #1f2937;
      min-height: 100vh;
    }
    .wrap { max-width: 1200px; margin: 0 auto; }
    .page-header {
      background: #fff;
      border-radius: 12px;
      padding: 14px 18px;
      box-shadow: 0 8px 20px rgba(2, 6, 23, .08);
      margin-bottom: 12px;
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 14px;
      align-items: center;
    }
    .brand-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    .brand-art { width: 160px; max-width: 100%; height: auto; display: block; }
    .brand-text {
      text-align: center;
      font-size: 20px;
      line-height: 1.4;
      color: #475569;
      font-weight: 700;
    }
    .toolbar {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .toolbar button {
      width: auto;
      padding: 10px 14px;
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .toolbar button:hover { background: #1e40af; }
    /* Role picker: two-band card (unlike plain single-color cards elsewhere) */
    .card {
      max-width: 560px;
      border-radius: 12px;
      padding: 0;
      box-shadow: 0 10px 24px rgba(2, 6, 23, .12);
      overflow: hidden;
      background: #fff;
    }
    .card-top {
      background: #fff;
      padding: 28px 28px 24px;
    }
    .card-bottom {
      background: #e8e9ed;
      padding: 20px 28px 22px;
      border-top: 1px solid #d1d5db;
    }
    .prompt {
      margin: 0 0 18px;
      font-size: 18px;
      font-weight: 400;
      color: #111;
    }
    .role-row {
      display: flex;
      flex-wrap: wrap;
      gap: 28px;
      align-items: center;
      margin: 0;
    }
    .role-row label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .role-row input[type="radio"] {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: #1d4ed8;
    }
    .go-next {
      display: inline-block;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #1d4ed8;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .go-next:hover { background: #1e40af; }
    @media (max-width: 900px) {
      .page-header { grid-template-columns: 1fr; text-align: center; }
      .brand-left { align-items: center; }
      .brand-text { font-size: 16px; }
    }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div class="brand-left">
        <img src="/web/header-art-image" alt="Header Art" class="brand-art" />
      </div>
      <div class="brand-text">Sharp & Tannan Chartered Accountants</div>
      <div></div>
    </div>

    <div class="toolbar">
      <button type="button" onclick="logoutAndRedirect()">Logout</button>
    </div>

    <div class="card">
      <div class="card-top">
        <p class="prompt">I HERE TO</p>
        <div class="role-row">
          <label>
            <input type="radio" name="portal" value="vendor" checked />
            Vendor
          </label>
          <label>
            <input type="radio" name="portal" value="customer" />
            Customer
          </label>
        </div>
      </div>
      <div class="card-bottom">
        <button type="button" class="go-next" id="goNextBtn">Go Next</button>
      </div>
    </div>
  </div>

  <script>
    function logoutAndRedirect() {
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");
      sessionStorage.removeItem("name");
      sessionStorage.removeItem("passwordChangeRequired");
      fetch("/api/auth/logout", { method: "POST", keepalive: true }).catch(() => {});
      window.location.href = "/web/login";
    }

    const params = new URLSearchParams(window.location.search);
    const nextParam = params.get("next") || "";

    function safeWebPath(raw) {
      const t = String(raw || "").trim();
      if (!t.startsWith("/web/") || t.startsWith("//")) return "";
      return t;
    }

    document.getElementById("goNextBtn").addEventListener("click", () => {
      const selected = document.querySelector('input[name="portal"]:checked');
      const role = selected ? selected.value : "vendor";
      const safeNext = safeWebPath(nextParam);

      if (role === "vendor") {
        window.location.href = safeNext || "/web/vendor-dashboard";
        return;
      }
      window.location.href = "/web/customer-dashboard";
    });
  </script>
</body>
</html>
