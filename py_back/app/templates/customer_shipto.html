<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Ship To Address</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 20px; color: #1f2937; }
    .wrap { max-width: 1220px; margin: 0 auto; }
    .page-header { background: #fff; border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 20px rgba(2, 6, 23, .08); margin-bottom: 12px; display: grid; grid-template-columns: 180px 1fr auto; gap: 14px; align-items: center; }
    .brand-left { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .brand-art { width: 160px; max-width: 100%; height: auto; display: block; }
    .brand-text { text-align: center; font-size: 20px; line-height: 1.4; color: #475569; font-weight: 700; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; justify-content: flex-end; }
    .toolbar button { width: auto; padding: 10px 14px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); margin-bottom: 12px; }
    h1 { margin: 0 0 10px; color: #1e3a8a; }
    .muted { margin: 0; color: #64748b; }
    .controls { margin-top: 14px; display: grid; grid-template-columns: 1fr auto auto; gap: 10px; }
    .controls input { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; }
    .controls button { width: auto; min-width: 160px; }
    .table-card { background: #fff; border-radius: 12px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      text-align: left;
      font-size: 13px;
      letter-spacing: .02em;
      color: #334155;
      background: #eff6ff;
      border-bottom: 1px solid #dbeafe;
      padding: 12px 10px;
    }
    tbody td {
      border-bottom: 1px solid #e2e8f0;
      padding: 10px;
      font-size: 14px;
      color: #1f2937;
      vertical-align: top;
      word-break: break-word;
    }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fafc; }
    tbody tr.selected { background: #dbeafe; }
    .row-actions { margin-top: 12px; display: flex; justify-content: flex-end; }
    .row-actions button { width: auto; min-width: 260px; padding: 10px 14px; }
    .msg { margin-top: 10px; font-size: 14px; min-height: 20px; }
    .msg.ok { color: #0a7a2d; }
    .msg.err { color: #b3261e; }
    button { background: #1d4ed8; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    button.secondary { background: #475569; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    @media (max-width: 980px) {
      .page-header { grid-template-columns: 1fr; text-align: center; }
      .brand-left { align-items: center; }
      .controls { grid-template-columns: 1fr; }
      .controls button { width: 100%; }
      .row-actions button { width: 100%; }
      .table-card { overflow-x: auto; }
      table { min-width: 920px; }
    }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="wrap">
    <div class="page-header">
      <div class="brand-left">
        <img src="/web/header-art-image" alt="Header Art" class="brand-art" />
      </div>
      <div class="brand-text">Sharp & Tannan Chartered Accountants</div>
      <div></div>
    </div>

    <div class="toolbar">
      <button type="button" class="secondary" onclick="location.href='/web/customer-dashboard'">Go Back</button>
      <button type="button" onclick="logoutAndRedirect()">Logout</button>
    </div>

    <div class="card">
      <h1>Add Ship to Address in Customer</h1>
      <p id="loginInfo" class="muted"></p>
      <div class="controls">
        <input id="searchInput" type="text" placeholder="Search by Record ID, Customer, Company, Status..." />
        <button id="refreshBtn" type="button" class="secondary">Refresh Records</button>
        <button id="openUpdateBtn" type="button" disabled>Open Update Customer Form</button>
      </div>
      <div id="tableMessage" class="msg"></div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th style="width: 140px;">Record ID</th>
            <th style="width: 220px;">Customer Name</th>
            <th style="width: 240px;">Company</th>
            <th style="width: 150px;">Category</th>
            <th style="width: 220px;">Approver Status</th>
            <th style="width: 160px;">Created/Updated</th>
          </tr>
        </thead>
        <tbody id="recordsBody">
          <tr><td colspan="6" class="muted">Loading records...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allRows = [];
    let filteredRows = [];
    let selectedRecordId = "";

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function parseApiResponse(res) {
      const text = await res.text();
      if (!text) return {};
      try {
        return JSON.parse(text);
      } catch (_) {
        return { detail: text };
      }
    }

    function setTableMessage(text, kind = "") {
      const el = document.getElementById("tableMessage");
      if (!el) return;
      el.textContent = text || "";
      el.className = kind ? `msg ${kind}` : "msg";
    }

    function syncActionState() {
      const openBtn = document.getElementById("openUpdateBtn");
      if (openBtn) {
        openBtn.disabled = !selectedRecordId;
      }
    }

    function renderRows(rows) {
      const body = document.getElementById("recordsBody");
      if (!body) return;

      if (!rows.length) {
        body.innerHTML = '<tr><td colspan="6" class="muted">No records found for your login.</td></tr>';
        return;
      }

      body.innerHTML = rows.map((row) => {
        const record = String(row.record || "").trim();
        const isSelected = selectedRecordId && selectedRecordId.toLowerCase() === record.toLowerCase();
        return `
          <tr class="${isSelected ? "selected" : ""}" data-record="${escapeHtml(record)}">
            <td>${escapeHtml(record || "-")}</td>
            <td>${escapeHtml(row.name || "-")}</td>
            <td>${escapeHtml(row.company || "-")}</td>
            <td>${escapeHtml(row.category || "-")}</td>
            <td>${escapeHtml(row.approverStatus || "-")}</td>
            <td>${escapeHtml(row.createdAt || "-")}</td>
          </tr>
        `;
      }).join("");
    }

    function applyFilter() {
      const searchInput = document.getElementById("searchInput");
      const term = String(searchInput?.value || "").trim().toLowerCase();
      if (!term) {
        filteredRows = [...allRows];
      } else {
        filteredRows = allRows.filter((row) => {
          const line = [
            row.record,
            row.name,
            row.company,
            row.category,
            row.approverStatus,
            row.createdAt,
          ].map((value) => String(value || "").toLowerCase()).join(" ");
          return line.includes(term);
        });
      }

      if (selectedRecordId) {
        const exists = filteredRows.some((row) => String(row.record || "").trim().toLowerCase() === selectedRecordId.toLowerCase());
        if (!exists) {
          selectedRecordId = "";
        }
      }
      renderRows(filteredRows);
      syncActionState();
    }

    async function loadShipToRecords() {
      const token = String(sessionStorage.getItem("token") || "").trim();
      if (!token) {
        window.location.replace("/web/login");
        return;
      }

      setTableMessage("Loading records...");
      try {
        const res = await fetch("/api/customer/shipto-records", {
          headers: {
            "Authorization": `Bearer ${token}`,
          },
        });
        const data = await parseApiResponse(res);
        if (!res.ok) {
          if (res.status === 401) {
            window.location.replace("/web/login");
            return;
          }
          throw new Error(data.detail || "Unable to load records");
        }
        allRows = Array.isArray(data) ? data : [];
        selectedRecordId = "";
        applyFilter();
        setTableMessage(`${allRows.length} record(s) loaded.`, "ok");
      } catch (err) {
        setTableMessage(err.message || "Unable to load records.", "err");
      }
    }

    function requireSessionLogin() {
      if (sessionStorage.getItem("token")) return;
      fetch("/api/auth/logout", { method: "POST", keepalive: true }).catch(() => {});
      window.location.replace("/web/login");
    }
    requireSessionLogin();

    async function logoutAndRedirect() {
      await fetch("/api/auth/logout", { method: "POST" });
      sessionStorage.removeItem("token");
      sessionStorage.removeItem("role");
      sessionStorage.removeItem("email");
      sessionStorage.removeItem("name");
      sessionStorage.removeItem("botName");
      window.location.href = "/web/login";
    }

    window.addEventListener("DOMContentLoaded", () => {
      const email = String(sessionStorage.getItem("email") || "").trim();
      const role = String(sessionStorage.getItem("role") || "").trim();
      const info = document.getElementById("loginInfo");
      if (info) {
        info.textContent = email
          ? `Logged in as ${email}${role ? ` (${role})` : ""}. Select one record and update Ship-to address fields.`
          : "Select one record and update Ship-to address fields.";
      }

      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", applyFilter);
      }

      const refreshBtn = document.getElementById("refreshBtn");
      if (refreshBtn) {
        refreshBtn.addEventListener("click", loadShipToRecords);
      }

      const body = document.getElementById("recordsBody");
      if (body) {
        body.addEventListener("click", (event) => {
          const row = event.target.closest("tr[data-record]");
          if (!row) return;
          const nextRecord = String(row.dataset.record || "").trim();
          if (!nextRecord) return;
          if (selectedRecordId.toLowerCase() === nextRecord.toLowerCase()) {
            selectedRecordId = "";
          } else {
            selectedRecordId = nextRecord;
          }
          renderRows(filteredRows);
          syncActionState();
        });
      }

      const openUpdateBtn = document.getElementById("openUpdateBtn");
      if (openUpdateBtn) {
        openUpdateBtn.addEventListener("click", () => {
          if (!selectedRecordId) {
            setTableMessage("Please select one record first.", "err");
            return;
          }
          const target = `/web/update-customer?recordId=${encodeURIComponent(selectedRecordId)}&mode=shipto`;
          window.location.href = target;
        });
      }

      loadShipToRecords();
      syncActionState();
    });
  </script>
</body>
</html>
