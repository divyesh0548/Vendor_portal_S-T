<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pre-Screening</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2ff; margin: 0; padding: 20px; color: #1f2937; }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 10px 24px rgba(2, 6, 23, .08); }
    h1 { margin-top: 0; font-size: 26px; color: #1e3a8a; }
    h2 { margin: 12px 0 16px; font-size: 18px; color: #1e3a8a; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .question { padding: 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; }
    .inline { display: flex; gap: 14px; align-items: center; font-size: 13px; margin-top: 8px; }
    .inline label { margin: 0; font-weight: 600; }
    .toolbar { margin-bottom: 12px; display: flex; gap: 8px; }
    .toolbar button { width: auto; padding: 10px 14px; }
    button { background: #1d4ed8; color: #fff; border: none; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 11px 14px; }
    .actions { margin-top: 14px; display: flex; justify-content: flex-end; }
    .msg { margin-top: 12px; color: #b3261e; font-size: 14px; }
  </style>
  <link rel="stylesheet" href="/web/portal-liquid.css?v=20260610-light" />
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <button type="button" onclick="location.href='/web/vendor-dashboard'">Go Back</button>
      <button type="button" onclick="location.href='/web/login'">Go to Login</button>
    </div>
    <div class="card">
      <h1 id="portalTitle">Vendor Registration Portal</h1>
      <h2>Pre-Screening Questions</h2>
      <form id="preScreenForm">
        <div class="grid" id="preScreenGrid"></div>
        <div class="actions">
          <button id="continueBtn" type="submit">Continue to Registration Form</button>
        </div>
      </form>
      <div id="message" class="msg"></div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const requestedFlow = (params.get("flow") || "domestic").trim().toLowerCase();
    const requiresSessionLogin = requestedFlow === "internal";

    function requireSessionLogin() {
      if (!requiresSessionLogin || sessionStorage.getItem("token")) {
        return;
      }
      fetch("/api/auth/logout", { method: "POST", keepalive: true }).catch(() => {});
      window.location.replace("/web/login");
    }

    requireSessionLogin();
    function createToastManager() {
      const host = document.createElement("div");
      host.style.position = "fixed";
      host.style.top = "20px";
      host.style.right = "20px";
      host.style.zIndex = "5000";
      document.body.appendChild(host);

      let activeToast = null;
      let activeTimer = null;

      function removeToast(toast) {
        if (!toast) return;
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        setTimeout(() => {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 200);
        if (activeToast === toast) {
          activeToast = null;
        }
      }

      return function showToast(text, kind = "info", duration = 10000) {
        if (!text) return;
        if (activeTimer) {
          clearTimeout(activeTimer);
          activeTimer = null;
        }
        if (activeToast) {
          activeToast.remove();
          activeToast = null;
        }

        const colors = {
          ok: "#166534",
          err: "#b91c1c",
          info: "#1d4ed8",
        };

        const toast = document.createElement("div");
        toast.textContent = text;
        toast.style.minWidth = "280px";
        toast.style.maxWidth = "420px";
        toast.style.padding = "14px 16px";
        toast.style.borderRadius = "12px";
        toast.style.boxShadow = "0 12px 32px rgba(15, 23, 42, 0.24)";
        toast.style.background = colors[kind] || colors.info;
        toast.style.color = "#fff";
        toast.style.fontSize = "14px";
        toast.style.fontWeight = "700";
        toast.style.opacity = "0";
        toast.style.transform = "translateY(-10px)";
        toast.style.transition = "opacity .2s ease, transform .2s ease";

        host.appendChild(toast);
        requestAnimationFrame(() => {
          toast.style.opacity = "1";
          toast.style.transform = "translateY(0)";
        });

        activeToast = toast;
        if (duration > 0) {
          activeTimer = setTimeout(() => removeToast(toast), duration);
        }
      };
    }

    const showToast = createToastManager();
    const flowConfig = {
      domestic: {
        title: "Vendor Registration Portal",
        continueLabel: "Continue to Registration Form",
        storageKey: "vendorPreScreenAnswers",
        nextUrl: "/web/vendor-registration/details"
      },
      import: {
        title: "Import Vendor Registration Portal",
        continueLabel: "Continue to Import Vendor Form",
        storageKey: "importVendorPreScreenAnswers",
        nextUrl: "/web/import-vendor"
      },
      internal: {
        title: "Internal Registration Portal",
        continueLabel: "Continue to Internal Registration Form",
        storageKey: "internalPreScreenAnswers",
        nextUrl: "/web/internal-registration/details"
      }
    };

    const activeFlow = flowConfig[requestedFlow] || flowConfig.domestic;

    const questions = [
      "Are you registered with any other group company of Sharp & Tannan?",
      "Have you previously supplied goods or services to Sharp & Tannan?",
      "Has your organization ever been blocked, blacklisted, or suspended by Sharp & Tannan?",
      "Have you or your organization been suspended, blacklisted, or penalized by any government body or regulatory authority?",
      "Are there any ongoing or past legal proceedings, criminal cases, or regulatory investigations?",
      "Have you or your directors been convicted under any law in the past 5 years?",
      "Do you have any affiliation with any Sharp & Tannan employee or board member?",
      "Are you a women-owned business?",
      "Are you a business owned by a person with a physical disability?"
    ];

    const host = document.getElementById("preScreenGrid");
    const message = document.getElementById("message");
    if (message) {
      message.style.display = "none";
    }
    const portalTitle = document.getElementById("portalTitle");
    const continueBtn = document.getElementById("continueBtn");

    if (portalTitle) {
      portalTitle.textContent = activeFlow.title;
    }
    if (continueBtn) {
      continueBtn.textContent = activeFlow.continueLabel;
    }
    document.title = `${activeFlow.title} - Pre-Screening`;

    questions.forEach((q, idx) => {
      const row = document.createElement("div");
      row.className = "question";
      row.innerHTML = `
        <label>Q${idx + 1}. ${q}</label>
        <div class="inline">
          <label><input type="radio" name="q${idx + 1}" value="Yes" required /> Yes</label>
          <label><input type="radio" name="q${idx + 1}" value="No" required /> No</label>
        </div>
      `;
      host.appendChild(row);
    });

    document.getElementById("preScreenForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const answers = {};
      for (let i = 1; i <= 9; i++) {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        if (!selected) {
          showToast(`Please answer question ${i}.`, "err");
          return;
        }
        answers[`q${i}`] = selected.value;
      }
      sessionStorage.setItem(activeFlow.storageKey, JSON.stringify(answers));
      window.location.href = activeFlow.nextUrl;
    });
  </script>
</body>
</html>
